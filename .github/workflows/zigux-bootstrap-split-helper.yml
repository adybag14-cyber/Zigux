name: zigux-bootstrap-split-helper

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'scripts/zigux/**'
      - 'third_party/**'
      - '.github/workflows/zigux-bootstrap-split-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace snapshot
        run: |
          set -euxo pipefail
          tmpdir="$(mktemp -d)"
          archive="$tmpdir/source.tar.gz"
          curl -L --fail "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" -o "$archive"
          tar -xzf "$archive" -C "$tmpdir"
          src_dir="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          shopt -s dotglob
          mv "$src_dir"/* "$GITHUB_WORKSPACE"/

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Setup pinned Zig toolchain
        run: |
          set -euxo pipefail
          eval "$(python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          target = "x86_64-linux"
          if target not in policy["upgrade_policy"]["archive_target_scope"]:
              raise SystemExit(f"missing required Linux CI archive target: {target}")
          channel = policy["channel"]
          filename = f"zig-{target}-{channel}.tar.xz"
          canonical_repo = "adybag14-cyber/zig"
          canonical_tag = "upstream-64dfaa568db0"
          canonical_url = f"https://github.com/{canonical_repo}/releases/download/{canonical_tag}/{filename}"
          print(f"ZIGUX_ZIG_TARGET='{target}'")
          print(f"ZIGUX_ZIG_CHANNEL='{channel}'")
          print(f"ZIGUX_ZIG_FILENAME='{filename}'")
          print(f"ZIGUX_ZIG_CANONICAL_URL='{canonical_url}'")
          PY
          )"
          archive="$RUNNER_TEMP/$ZIGUX_ZIG_FILENAME"
          install_parent="$RUNNER_TEMP/zigux-toolchain"
          extract_root="$install_parent/zig-$ZIGUX_ZIG_TARGET-$ZIGUX_ZIG_CHANNEL"
          rm -f "$archive"
          rm -rf "$install_parent"
          mkdir -p "$install_parent"
          curl --fail             --location             --retry 5             --retry-all-errors             --retry-delay 3             "$ZIGUX_ZIG_CANONICAL_URL"             -o "$archive"
          python3 - "$archive" "$ZIGUX_ZIG_TARGET" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive, target = sys.argv[1], sys.argv[2]
          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          expected = policy["archive_sha256"][target]
          actual = hashlib.sha256(Path(archive).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"pinned archive sha256 mismatch: expected {expected}, got {actual}")
          PY
          tar -xJf "$archive" -C "$install_parent"
          test -x "$extract_root/zig"
          echo "$extract_root" >> "$GITHUB_PATH"
          "$extract_root/zig" version

      - name: Self-test current split pinned Zig archive helper
        run: zig run scripts/zigux/split_pinned_zig_archive.zig -- --self-test

      - name: Self-test current Lane 05 split helper selftest checker
        run: zig run scripts/zigux/check_lane05_split_helper_selftest.zig -- --self-test

      - name: Self-test current Lane 05 split-helper workflow checker
        run: zig run scripts/zigux/check_lane05_split_helper_workflow.zig -- --self-test

      - name: Check current Lane 05 split-helper workflow packet
        run: zig run scripts/zigux/check_lane05_split_helper_workflow.zig
