name: zigux-bootstrap-split-helper

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'scripts/zigux/**'
      - 'third_party/**'
      - '.github/workflows/zigux-bootstrap-split-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace snapshot
        run: |
          set -euxo pipefail
          tmpdir="$(mktemp -d)"
          archive="$tmpdir/source.tar.gz"
          curl -L --fail "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" -o "$archive"
          tar -xzf "$archive" -C "$tmpdir"
          src_dir="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          shopt -s dotglob
          mv "$src_dir"/* "$GITHUB_WORKSPACE"/

      - name: Self-test current split pinned Zig archive helper
        run: zig run scripts/zigux/split_pinned_zig_archive.zig --self-test

      - name: Self-test current Lane 05 split helper selftest checker
        run: zig run scripts/zigux/check_lane05_split_helper_selftest.zig --self-test

      - name: Self-test current Lane 05 split-helper workflow checker
        run: zig run scripts/zigux/check_lane05_split_helper_workflow.zig --self-test

      - name: Check current Lane 05 split-helper workflow packet
        run: zig run scripts/zigux/check_lane05_split_helper_workflow.zig