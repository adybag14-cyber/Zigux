name: Apply MIPS FIT coverage repair

on:
  push:
    branches:
      - ci/fix-mips-fit-allmodconfig
    paths:
      - .github/workflows/apply-mips-fit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-mips-fit-allmodconfig

      - name: Apply permanent matrix policy and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          matrix_path = Path('.github/scripts/full_linux_matrix.py')
          matrix = matrix_path.read_text(encoding='utf-8')
          import_anchor = 'from typing import Any\n\n\n'
          helper = '''from typing import Any\n\n\nBROAD_PROFILE_TARGET_OVERRIDES = {\n    # MIPS allmodconfig combines multiple generic FIT board fragments. The\n    # resulting packaging target can reference board-only images that are not\n    # present in the synthetic combined configuration. vmlinux + modules still\n    # compiles the complete kernel/module source set without testing an invalid\n    # multi-board boot image.\n    "mips": ["vmlinux", "modules"],\n}\n\n\ndef coverage_targets(architecture: str, profile: str) -> list[str]:\n    broad = (\n        profile in {"allmodconfig", "allyesconfig"}\n        or profile.startswith("randconfig-")\n    )\n    if broad and architecture in BROAD_PROFILE_TARGET_OVERRIDES:\n        return list(BROAD_PROFILE_TARGET_OVERRIDES[architecture])\n    return ["all", "modules"]\n\n\n'''
          if import_anchor not in matrix:
              raise SystemExit('matrix import anchor not found')
          matrix = matrix.replace(import_anchor, helper, 1)
          target_literal = '"targets": ["all", "modules"],'
          if matrix.count(target_literal) < 4:
              raise SystemExit('unexpected target literal count')
          matrix = matrix.replace(
              target_literal,
              '"targets": coverage_targets(arch["id"], profile),',
              2,
          )
          matrix_path.write_text(matrix, encoding='utf-8')

          test_path = Path('.github/scripts/test_full_linux_coverage.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '    assert full["total_jobs"] == 179\n'
          assertions = '''    assert full["total_jobs"] == 179\n\n    mips_architecture_rows = [\n        row for row in full["groups"]["architecture"]\n        if row["architecture"] == "mips"\n    ]\n    assert next(row for row in mips_architecture_rows if row["profile"] == "defconfig")["targets"] == [\n        "all", "modules"\n    ]\n    mips_broad_rows = [row for row in mips_architecture_rows if row["profile"] != "defconfig"]\n    assert mips_broad_rows\n    assert all(row["targets"] == ["vmlinux", "modules"] for row in mips_broad_rows)\n\n    llvm_mips_rows = {\n        row["profile"]: row for row in full["groups"]["llvm"]\n        if row["architecture"] == "mips"\n    }\n    assert llvm_mips_rows["defconfig"]["targets"] == ["all", "modules"]\n    assert llvm_mips_rows["allmodconfig"]["targets"] == ["vmlinux", "modules"]\n'''
          if test_anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(test_anchor, assertions, 1)
          test_path.write_text(tests, encoding='utf-8')

          validator = Path('.github/workflows/validate-mips-llvm-allmodconfig.yml')
          validator.write_text('''name: Validate MIPS LLVM allmodconfig repair\n\non:\n  push:\n    branches:\n      - ci/fix-mips-fit-allmodconfig\n    paths:\n      - .github/scripts/full_linux_matrix.py\n      - .github/scripts/test_full_linux_coverage.py\n      - .github/workflows/validate-mips-llvm-allmodconfig.yml\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: validate-mips-llvm-allmodconfig-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  offline:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n      - name: Validate matrix policy and tests\n        shell: bash\n        run: |\n          set -euo pipefail\n          sudo apt-get update\n          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd\n          python3 -m py_compile .github/scripts/*.py\n          python3 .github/scripts/test_full_linux_coverage.py\n          git diff --check\n\n  exact-mips-row:\n    needs: offline\n    uses: ./.github/workflows/full-linux-row.yml\n    with:\n      row_json: >-\n        {"id":"llvm-mips-allmodconfig","kind":"llvm","architecture":"mips","label":"MIPS","kbuild_arch":"mips","profile":"allmodconfig","config_target":"allmodconfig","toolchain":"llvm","gcc_triple":"mips-linux","llvm_ias":true,"seed":"","targets":["vmlinux","modules"],"extra_packages":[]}\n      source_sha: 62cc90241548d5570ee68e01aaba6506964e9811\n      runner_type: kernel\n''', encoding='utf-8')
          PY

          rm .github/workflows/apply-mips-fit-fix.yml
          git diff --check
          python3 -m py_compile .github/scripts/full_linux_matrix.py .github/scripts/test_full_linux_coverage.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: avoid invalid MIPS FIT packaging in broad coverage"
          git push origin HEAD:ci/fix-mips-fit-allmodconfig
