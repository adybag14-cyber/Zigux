name: Apply full Linux campaign fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-full-linux-campaign-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-full-linux-campaign-30451881719
          fetch-depth: 1

      - name: Add dependencies exposed by later campaign rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('.github/config/full-linux-coverage.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in config['auxiliary_tasks']}
          for task_id, package in (
              ('selftests', 'libasound2-dev'),
              ('bpftool', 'llvm'),
          ):
              packages = tasks[task_id].setdefault('extra_packages', [])
              if package not in packages:
                  packages.append(package)
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          tests_path = Path('.github/scripts/test_full_linux_coverage.py')
          text = tests_path.read_text(encoding='utf-8')
          old = '''    perf = next(row for row in full["groups"]["auxiliary"] if row["id"] == "perf")\n    assert {"libtraceevent-dev", "libtracefs-dev", "libcapstone-dev", "libpfm4-dev", "libbabeltrace2-dev"}.issubset(perf["extra_packages"])\n    all_ids = [row["id"] for rows in full["groups"].values() for row in rows]\n'''
          new = '''    auxiliary_by_id = {row["id"]: row for row in full["groups"]["auxiliary"]}\n    perf = auxiliary_by_id["perf"]\n    assert {"libtraceevent-dev", "libtracefs-dev", "libcapstone-dev", "libpfm4-dev", "libbabeltrace2-dev"}.issubset(perf["extra_packages"])\n    assert "libasound2-dev" in auxiliary_by_id["selftests"]["extra_packages"]\n    assert "llvm" in auxiliary_by_id["bpftool"]["extra_packages"]\n    all_ids = [row["id"] for rows in full["groups"].values() for row in rows]\n'''
          if old not in text:
              raise SystemExit('expected dependency assertion block was not found')
          tests_path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit follow-up production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/config/full-linux-coverage.json .github/scripts/test_full_linux_coverage.py
          git commit -m "ci: add selftests and bpftool prerequisites"
          git push origin HEAD:ci/fix-full-linux-campaign-30451881719
