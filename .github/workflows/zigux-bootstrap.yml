name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Install Zig toolchain
        run: |
          set -euxo pipefail
          ZIG_VERSION='0.17.0-dev.87+9b177a7d2'
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -L "https://ziglang.org/builds/${ZIG_ARCHIVE}" -o "$RUNNER_TEMP/${ZIG_ARCHIVE}"
          tar -xf "$RUNNER_TEMP/${ZIG_ARCHIVE}" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Self-test Phase 12 build-only surface checker
        run: python3 scripts/zigux/check-build-only-phase12-surface.py --self-test

      - name: Check Phase 12 build-only surface
        run: python3 scripts/zigux/check-build-only-phase12-surface.py

      - name: Self-test Phase 12 release-readiness packet checker
        run: python3 scripts/zigux/check-phase12-release-readiness-packet.py --self-test

      - name: Validate Phase 12 degraded-workflow bundle
        run: make -C zigux phase12-validate

      - name: Check Phase 12 release-readiness packet
        run: python3 scripts/zigux/check-phase12-release-readiness-packet.py

      - name: Run focused Phase 12 smoke shard
        run: make -C zigux phase12-smoke

      - name: Run Phase 12 complex driver tests
        run: zig build test --build-file zigux/tests/phase12_build.zig --summary all
