name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Self-test Zig installer
        run: python3 scripts/zigux/install-zig.py --self-test

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --channel 0.17.0-dev.87+9b177a7d2 --dest .zig-toolchain

      - name: Self-test Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check Zig toolchain
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Validate bootstrap files
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Validate Phase 1 helper files
        run: python3 scripts/zigux/validate-phase1.py

      - name: Self-test Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py --self-test

      - name: Check Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py

      - name: Validate Phase 1 closure
        run: python3 scripts/zigux/validate-phase1-closure.py

      - name: Validate Phase 2 fixdep files
        run: python3 scripts/zigux/validate-phase2.py

      - name: Self-test Phase 2 tool-manifest packet checker
        run: python3 scripts/zigux/check-phase2-tool-manifest-packets.py --self-test

      - name: Check Phase 2 tool-manifest packet
        run: python3 scripts/zigux/check-phase2-tool-manifest-packets.py

      - name: Self-test Phase 2 genksyms bridge alignment
        run: python3 scripts/zigux/check-phase2-genksyms-bridge-selftest-alignment.py --self-test

      - name: Check Phase 2 genksyms bridge alignment
        run: python3 scripts/zigux/check-phase2-genksyms-bridge-selftest-alignment.py

      - name: Validate Phase 2 closure
        run: python3 scripts/zigux/validate-phase2-closure.py

      - name: Check Phase 2 tests README alignment
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py

      - name: Self-test Phase 2 cross-target compile checker
        run: python3 scripts/zigux/check-phase2-cross.py --self-test

      - name: Self-test Phase 2 cross-selftest alignment
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py --self-test

      - name: Check Phase 2 cross-selftest alignment
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py

      - name: Self-test Phase 2 toolchain pin scope
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py --self-test

      - name: Check Phase 2 toolchain pin scope
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py

      - name: Validate Phase 3 slices
        run: python3 scripts/zigux/validate-phase3.py

      - name: Check Phase 3 selftest review surface
        run: python3 scripts/zigux/check-phase3-selftest-surface.py

      - name: Validate Phase 3 policy/unsafe survey
        run: python3 scripts/zigux/validate-phase3-policy-unsafe-survey.py

      - name: Check Phase 3 policy-byte guards
        run: python3 scripts/zigux/check-phase3-policy-byte-guards.py

      - name: Validate Phase 3 export/UAPI survey
        run: python3 scripts/zigux/validate-phase3-export-uapi-survey.py

      - name: Validate Phase 3 low-level wrapper survey
        run: python3 scripts/zigux/validate-phase3-low-level-wrapper-survey.py

      - name: Check Phase 3 ABI interop packet
        run: python3 scripts/zigux/check-phase3-abi.py

      - name: Validate Phase 4 diff gates
        run: python3 scripts/zigux/validate-phase4.py

      - name: Self-test Phase 4 validator
        run: python3 scripts/zigux/validate-phase4.py --self-test

      - name: Self-test artifact diff helper
        run: python3 scripts/zigux/artifact_diff.py --self-test

      - name: Self-test artifact diff contract checker
        run: python3 scripts/zigux/check-artifact-diff-contract.py --self-test

      - name: Check artifact diff contract replay
        run: python3 scripts/zigux/check-artifact-diff-contract.py

      - name: Self-test Phase 4 gate evidence checker
        run: python3 scripts/zigux/check-phase4-gate-evidence.py --self-test

      - name: Self-test Phase 3 validator
        run: python3 scripts/zigux/validate-phase3.py --self-test

      - name: Self-test Phase 3 selftest review surface
        run: python3 scripts/zigux/check-phase3-selftest-surface.py --self-test

      - name: Self-test Phase 3 policy/unsafe survey
        run: python3 scripts/zigux/validate-phase3-policy-unsafe-survey.py --self-test

      - name: Self-test Phase 3 policy-byte guard checker
        run: python3 scripts/zigux/check-phase3-policy-byte-guards.py --self-test

      - name: Self-test Phase 3 export/UAPI survey
        run: python3 scripts/zigux/validate-phase3-export-uapi-survey.py --self-test

      - name: Self-test Phase 3 low-level wrapper survey
        run: python3 scripts/zigux/validate-phase3-low-level-wrapper-survey.py --self-test

      - name: Self-test Phase 3 catalog
        run: python3 scripts/zigux/phase3_catalog.py --self-test

      - name: Audit Phase 3 documentation sync
        run: python3 scripts/zigux/phase3_catalog.py --audit-doc-sync

      - name: Self-test Phase 3 README tooling inventory
        run: python3 scripts/zigux/check-phase3-readme-tooling-inventory.py --self-test

      - name: Check Phase 3 README tooling inventory
        run: python3 scripts/zigux/check-phase3-readme-tooling-inventory.py

      - name: Self-test Phase 3 shared helper
        run: python3 scripts/zigux/phase3_check_lib.py --self-test

      - name: Self-test Phase 3 runner
        run: python3 scripts/zigux/run-phase3-checks.py --self-test

      - name: Self-test Phase 3 wrapper generator
        run: python3 scripts/zigux/generate-phase3-check-wrappers.py --self-test

      - name: Validate Phase 3 wrapper templates
        run: python3 scripts/zigux/generate-phase3-check-wrappers.py --check

      - name: Check Phase 1 helper parity
        run: python3 scripts/zigux/check-phase1-parity.py

      - name: Check Phase 1 helper benchmark output
        run: python3 scripts/zigux/check-phase1-bench.py

      - name: Self-test Phase 2 fixdep gate checker
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py --self-test

      - name: Check Phase 2 fixdep gate packet
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py

      - name: Self-test bounded fixdep parity checker
        run: python3 scripts/zigux/check-fixdep-diff.py --self-test

      - name: Check bounded fixdep artifact parity and determinism
        run: python3 scripts/zigux/check-fixdep-diff.py

      - name: Self-test bounded genksyms bridge parity checker
        run: python3 scripts/zigux/check-genksyms-bridge.py --self-test

      - name: Check bounded genksyms bridge parity
        run: python3 scripts/zigux/check-genksyms-bridge.py

      - name: Check bounded genksyms CRC artifact parity
        run: python3 scripts/zigux/check-genksyms-crc-diff.py

      - name: Self-test Phase 2 kconfig selftest alignment
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py --self-test

      - name: Check Phase 2 kconfig selftest alignment
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py

      - name: Self-test bounded kconfig bridge parity checker
        run: python3 scripts/zigux/check-kconfig-bridge.py --self-test

      - name: Check bounded kconfig bridge parity
        run: python3 scripts/zigux/check-kconfig-bridge.py

      - name: Check bounded mk_elfconfig artifact parity
        run: python3 scripts/zigux/check-mk-elfconfig-diff.py

      - name: Check discovered Phase 3 parity
        run: python3 scripts/zigux/run-phase3-checks.py

      - name: Run bounded fixdep unit tests
        run: zig test scripts/zigux/fixdep.zig

      - name: Run bounded genksyms bridge unit tests
        run: zig test scripts/zigux/genksyms.zig

      - name: Run bounded genksyms CRC unit tests
        run: zig test scripts/zigux/genksyms_crc.zig

      - name: Run bounded conf bridge unit tests
        run: zig test scripts/zigux/kconfig/conf_bridge.zig

      - name: Run bounded confdata bridge unit tests
        run: zig test scripts/zigux/kconfig/confdata_bridge.zig

      - name: Run bounded mk_elfconfig unit tests
        run: zig test scripts/zigux/mk_elfconfig.zig

      - name: Run Phase 1 helper tests
        run: zig build test --build-file zigux/tests/build.zig

      - name: Run Phase 1 helper benchmark smoke
        run: zig build bench --build-file zigux/tests/build.zig -Doptimize=ReleaseSafe

      - name: Run Phase 3 ABI/interp substrate tests
        run: zig build phase3-test --build-file zigux/tests/build.zig

      - name: Run Phase 4 diff tests
        run: zig build test --build-file zigux/tests/phase4_build.zig

      - name: Run Phase 5 reference sample tests
        run: zig build test --build-file zigux/tests/phase5_build.zig --summary all

      - name: Self-test Phase 6 shared-surface checker
        run: python3 scripts/zigux/check-phase6-shared-surface.py --self-test

      - name: Check Phase 6 shared surface
        run: python3 scripts/zigux/check-phase6-shared-surface.py

      - name: Run Phase 6 leaf helper tests
        run: zig build test --build-file zigux/tests/phase6_build.zig --summary all

      - name: Run Phase 6 checksum perf gate
        run: zig build phase6-checksum-perf --build-file zigux/tests/phase6_build.zig -Doptimize=ReleaseSafe --summary all

      - name: Run Phase 6 hexdump perf gate
        run: zig build phase6-hexdump-perf --build-file zigux/tests/phase6_build.zig -Doptimize=ReleaseSafe --summary all

      - name: Validate Phase 7 runtime helper gates
        run: make -C zigux phase7-validate

      - name: Run Phase 7 runtime helper tests
        run: zig build test --build-file zigux/tests/phase7_build.zig --summary all

      - name: Validate Phase 8 tooling packet
        run: make -C zigux phase8-validate

      - name: Run focused Phase 8 help and kallsyms tests
        run: make -C zigux phase8-help-kallsyms-test

      - name: Run Phase 8 tooling tests
        run: zig build test --build-file zigux/tests/phase8_build.zig --summary all

      - name: Self-test Phase 9 build-only surface checker
        run: python3 scripts/zigux/check-phase9-build-only-surface.py --self-test

      - name: Check Phase 9 build-only surface
        run: python3 scripts/zigux/check-phase9-build-only-surface.py

      - name: Run Phase 9 runtime helper tests
        run: make -C zigux phase9

      - name: Run Phase 10 checker-backed virtio helper tests
        run: make -C zigux phase10-test

      - name: Self-test Phase 11 shared replay contract checker
        run: python3 scripts/zigux/check-phase11-shared-replay-contract.py --self-test

      - name: Run Phase 11 shared replay contract checker
        run: make -C zigux phase11-contract

      - name: Run Phase 11 watchdog and console tests
        run: zig build test --build-file zigux/tests/phase11_build.zig --summary all

      - name: Run dedicated Phase 11 hvc survey replay
        run: make -C zigux phase11-hvc-survey

      - name: Self-test Phase 12 build-only surface checker
        run: python3 scripts/zigux/check-build-only-phase12-surface.py --self-test

      - name: Check Phase 12 build-only surface
        run: python3 scripts/zigux/check-build-only-phase12-surface.py

      - name: Run focused Phase 12 smoke shard
        run: make -C zigux phase12-smoke

      - name: Run Phase 12 complex driver tests
        run: zig build test --build-file zigux/tests/phase12_build.zig --summary all

      - name: Validate Phase 13 release-discipline packet
        run: make -C zigux phase13-validate

      - name: Run Phase 13 shared helper tests
        run: make -C zigux phase13-test

      - name: Validate Phase 14 shared smoke packet
        run: make -C zigux phase14-validate

      - name: Run focused Phase 14 smoke shard
        run: make -C zigux phase14-smoke

      - name: Run Phase 14 internal bridge tests
        run: zig build test --build-file zigux/tests/phase14_build.zig --summary all

      - name: Validate Phase 15 governance packet
        run: make -C zigux phase15-validate

      - name: Run Phase 15 governance tests
        run: make -C zigux phase15-test

  phase2-cross:
    if: >
      github.event_name != 'push' ||
      contains(join(github.event.commits.*.added, ' '), '.github/workflows/zigux-bootstrap.yml') ||
      contains(join(github.event.commits.*.modified, ' '), '.github/workflows/zigux-bootstrap.yml') ||
      contains(join(github.event.commits.*.removed, ' '), '.github/workflows/zigux-bootstrap.yml') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/install-zig.py') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/install-zig.py') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/install-zig.py') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/check-phase2-cross.py') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/check-phase2-cross.py') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/check-phase2-cross.py') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/fixdep.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/fixdep.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/fixdep.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/genksyms.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/genksyms.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/genksyms.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/genksyms_crc.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/genksyms_crc.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/genksyms_crc.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/mk_elfconfig.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/mk_elfconfig.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/mk_elfconfig.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/kconfig/conf_bridge.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/kconfig/conf_bridge.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/kconfig/conf_bridge.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'scripts/zigux/kconfig/confdata_bridge.zig') ||
      contains(join(github.event.commits.*.modified, ' '), 'scripts/zigux/kconfig/confdata_bridge.zig') ||
      contains(join(github.event.commits.*.removed, ' '), 'scripts/zigux/kconfig/confdata_bridge.zig') ||
      contains(join(github.event.commits.*.added, ' '), 'zigux/tests/fixtures/phase2_tool_manifest.json') ||
      contains(join(github.event.commits.*.modified, ' '), 'zigux/tests/fixtures/phase2_tool_manifest.json') ||
      contains(join(github.event.commits.*.removed, ' '), 'zigux/tests/fixtures/phase2_tool_manifest.json') ||
      contains(join(github.event.commits.*.added, ' '), 'zigux/tests/fixtures/phase2_cross_targets.json') ||
      contains(join(github.event.commits.*.modified, ' '), 'zigux/tests/fixtures/phase2_cross_targets.json') ||
      contains(join(github.event.commits.*.removed, ' '), 'zigux/tests/fixtures/phase2_cross_targets.json')
    needs: bootstrap
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig_target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - riscv64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --channel 0.17.0-dev.87+9b177a7d2 --dest .zig-toolchain

      - name: Check bounded Phase 2 cross-target compile
        run: python3 scripts/zigux/check-phase2-cross.py --target ${{ matrix.zig_target }}