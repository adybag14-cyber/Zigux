name: zigux-bootstrap
# Keep this lane tied to files that the current checkout actually contains.
# Run every master push so exact-head bootstrap status stays attached even when path filtering misses a live change.

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Setup pinned Zig toolchain
        run: |
          set -euxo pipefail
          eval "$(python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          targets = policy["upgrade_policy"]["archive_target_scope"]
          if len(targets) != 1:
              raise SystemExit(f"expected exactly one pinned archive target, got {len(targets)}")
          target = targets[0]
          channel = policy["channel"]
          filename = f"zig-{target}-{channel}.tar.xz"
          url = f"https://ziglang.org/builds/{filename}"
          print(f"ZIGUX_ZIG_TARGET='{target}'")
          print(f"ZIGUX_ZIG_CHANNEL='{channel}'")
          print(f"ZIGUX_ZIG_FILENAME='{filename}'")
          print(f"ZIGUX_ZIG_URL='{url}'")
          PY
          )"
          mkdir -p .zig-toolchain
          archive_path=".zig-toolchain/$ZIGUX_ZIG_FILENAME"
          extract_root="$GITHUB_WORKSPACE/.zig-toolchain/zig-$ZIGUX_ZIG_TARGET-$ZIGUX_ZIG_CHANNEL"
          mirror_file=".zig-toolchain/community-mirrors.txt"
          rm -f "$archive_path" "$mirror_file"
          rm -rf "$extract_root"
          try_download() {
            local url="$1"
            if curl -L --fail "$url" -o "$archive_path"; then
              if python3 scripts/zigux/check-zig-toolchain.py --archive-only --archive "$archive_path" --archive-target "$ZIGUX_ZIG_TARGET"; then
                tar -xJf "$archive_path" -C .zig-toolchain
                zig_path="$extract_root/zig"
                if python3 scripts/zigux/check-zig-toolchain.py --zig "$zig_path"; then
                  return 0
                fi
              fi
              rm -f "$archive_path"
              rm -rf "$extract_root"
            fi
            return 1
          }
          download_success=0
          if curl -L --fail https://ziglang.org/download/community-mirrors.txt -o "$mirror_file"; then
            while IFS= read -r mirror_url; do
              [ -n "$mirror_url" ] || continue
              if try_download "${mirror_url%/}/$ZIGUX_ZIG_FILENAME?source=github-zigux-bootstrap"; then
                download_success=1
                break
              fi
            done < "$mirror_file"
          fi
          if [ "$download_success" -ne 1 ]; then
            if try_download "$ZIGUX_ZIG_URL"; then
              download_success=1
            fi
          fi
          if [ "$download_success" -ne 1 ]; then
            echo 'failed to install a verified pinned Zig archive from mirrors or ziglang.org' >&2
            exit 1
          fi
          zig_path="$extract_root/zig"
          echo "$extract_root" >> "$GITHUB_PATH"
          "$zig_path" version

      - name: Compile current scripts
        run: |
          set -euxo pipefail
          mapfile -t scripts < <(find scripts/zigux -maxdepth 1 -type f -name '*.py' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo 'no Python scripts found under scripts/zigux' >&2
            exit 1
          fi
          python3 -m py_compile "${scripts[@]}"

      - name: Self-test current Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check current Zig toolchain policy packet
        run: python3 scripts/zigux/check-zig-toolchain.py --policy-only

      - name: Check current pinned Zig archive packet
        run: python3 scripts/zigux/check-zig-toolchain.py --archive-only --allow-missing

      - name: Self-test current Phase 2 fixdep gate checker
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py --self-test

      - name: Check current Phase 2 fixdep gate packet
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py

      - name: Self-test current fixdep parity checker
        run: python3 scripts/zigux/check-fixdep-diff.py --self-test

      - name: Check current fixdep parity packet
        run: python3 scripts/zigux/check-fixdep-diff.py

      - name: Run current Phase 2 fixdep unit tests
        run: zig test scripts/zigux/fixdep.zig

      - name: Self-test current bootstrap validator
        run: python3 scripts/zigux/validate-bootstrap.py --self-test

      - name: Validate current bootstrap packet
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Self-test current kconfig bridge checker
        run: python3 scripts/zigux/check-kconfig-bridge.py --self-test

      - name: Check current kconfig bridge packet
        run: python3 scripts/zigux/check-kconfig-bridge.py

      - name: Run current Phase 2 conf bridge unit tests
        run: zig test scripts/zigux/kconfig/conf_bridge.zig

      - name: Run current Phase 2 confdata bridge unit tests
        run: zig test scripts/zigux/kconfig/confdata_bridge.zig

      - name: Self-test current Phase 2 kconfig bridge checker
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py --self-test

      - name: Check current Phase 2 kconfig bridge packet
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py

      - name: Self-test current Phase 2 kbuild routes checker
        run: python3 scripts/zigux/check-phase2-kbuild-routes.py --self-test

      - name: Check current Phase 2 kbuild packet
        run: python3 scripts/zigux/check-phase2-kbuild-routes.py

      - name: Self-test current Phase 2 tests README checker
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py --self-test

      - name: Check current Phase 2 tests README packet
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py

      - name: Self-test current Phase 2 cross checker
        run: python3 scripts/zigux/check-phase2-cross.py --self-test

      - name: Check current Phase 2 direct cross-route packet
        run: python3 scripts/zigux/check-phase2-cross.py

      - name: Self-test current Phase 2 cross selftest alignment checker
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py --self-test

      - name: Check current Phase 2 cross alignment packet
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py

      - name: Self-test current Phase 2 toolchain pinning checker
        run: python3 scripts/zigux/check-phase2-toolchain-pinning.py --self-test

      - name: Check current Phase 2 toolchain pinning packet
        run: python3 scripts/zigux/check-phase2-toolchain-pinning.py

      - name: Self-test current Phase 2 toolchain pin-scope checker
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py --self-test

      - name: Check current Phase 2 toolchain pin-scope packet
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py

      - name: Run current Phase 2 toolchain make route
        run: make -C zigux phase2-toolchain

      - name: Run current Phase 2 tools make route
        run: make -C zigux phase2-tools

      - name: Self-test current Phase 2 required-make-routes checker
        run: python3 scripts/zigux/check-phase2-required-make-routes.py --self-test

      - name: Check current Phase 2 required-make-routes packet
        run: python3 scripts/zigux/check-phase2-required-make-routes.py

      - name: Self-test current Phase 2 shared reminder checker
        run: python3 scripts/zigux/check-phase2-docs-shared-reminder.py --self-test

      - name: Check current Phase 2 shared reminder packet
        run: python3 scripts/zigux/check-phase2-docs-shared-reminder.py

      - name: Run current Phase 2 genksyms unit replay
        run: zig test scripts/zigux/genksyms.zig

      - name: Validate current Phase 2 tool packet
        run: python3 scripts/zigux/validate-phase2.py
