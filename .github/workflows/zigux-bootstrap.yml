name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Self-test Zig installer
        run: python3 scripts/zigux/install-zig.py --self-test

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --dest .zig-toolchain

      - name: Show Zig version
        run: zig version

      - name: Validate bootstrap files
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Self-test Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Self-test Phase 1 helper validator
        run: python3 scripts/zigux/validate-phase1.py --self-test

      - name: Validate Phase 1 helper files
        run: python3 scripts/zigux/validate-phase1.py

      - name: Self-test Phase 1 bitmap validator anchor checker
        run: python3 scripts/zigux/check-phase1-bitmap-validator-anchors.py --self-test

      - name: Check Phase 1 bitmap validator anchor coverage
        run: python3 scripts/zigux/check-phase1-bitmap-validator-anchors.py

      - name: Self-test Phase 1 find_bit validator anchor checker
        run: python3 scripts/zigux/check-phase1-find-bit-validator-anchors.py --self-test

      - name: Check Phase 1 find_bit validator anchor coverage
        run: python3 scripts/zigux/check-phase1-find-bit-validator-anchors.py

      - name: Self-test Phase 1 route summary count checker
        run: python3 scripts/zigux/check-phase1-route-summary-counts.py --self-test

      - name: Check Phase 1 route summary counts
        run: python3 scripts/zigux/check-phase1-route-summary-counts.py

      - name: Self-test Phase 1 validation route inventory checker
        run: python3 scripts/zigux/check-phase1-validation-route-inventory.py --self-test

      - name: Check Phase 1 validation route inventory
        run: python3 scripts/zigux/check-phase1-validation-route-inventory.py

      - name: Validate Phase 1 closure
        run: python3 scripts/zigux/validate-phase1-closure.py

      - name: Self-test Phase 1 closure validator
        run: python3 scripts/zigux/validate-phase1-closure.py --self-test

      - name: Self-test artifact diff helper
        run: python3 scripts/zigux/artifact_diff.py --self-test

      - name: Check artifact diff helper CLI contract
        run: python3 scripts/zigux/check-artifact-diff-contract.py

      - name: Validate Phase 2 fixdep files
        run: python3 scripts/zigux/validate-phase2.py

      - name: Self-test Phase 2 cross-target alignment checker
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py --self-test

      - name: Check Phase 2 cross-target alignment
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py

      - name: Self-test Phase 2 genksyms bridge alignment checker
        run: python3 scripts/zigux/check-phase2-genksyms-bridge-selftest-alignment.py --self-test

      - name: Check Phase 2 genksyms bridge alignment
        run: python3 scripts/zigux/check-phase2-genksyms-bridge-selftest-alignment.py

      - name: Self-test Phase 2 kconfig alignment checker
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py --self-test

      - name: Check Phase 2 kconfig alignment
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py

      - name: Self-test bounded fixdep checker
        run: python3 scripts/zigux/check-fixdep-diff.py --self-test

      - name: Self-test bounded Phase 2 cross-target checker
        run: python3 scripts/zigux/check-phase2-cross.py --self-test

      - name: Validate Phase 2 closure
        run: python3 scripts/zigux/validate-phase2-closure.py

      - name: Validate Phase 3 slices
        run: python3 scripts/zigux/validate-phase3.py

      - name: Check Phase 3 validation flow
        run: python3 scripts/zigux/check-phase3-validation-flow.py

      - name: Validate Phase 4 diff gates
        run: make -C zigux phase4-validate

      - name: Self-test Phase 4 validator
        run: python3 scripts/zigux/validate-phase4.py --self-test

      - name: Self-test Phase 3 validator
        run: python3 scripts/zigux/validate-phase3.py --self-test

      - name: Self-test Phase 3 validation flow checker
        run: python3 scripts/zigux/check-phase3-validation-flow.py --self-test

      - name: Self-test Phase 3 catalog
        run: python3 scripts/zigux/phase3_catalog.py --self-test

      - name: Audit Phase 3 documentation sync
        run: python3 scripts/zigux/phase3_catalog.py --audit-doc-sync

      - name: Check Phase 3 slug sanity
        run: python3 scripts/zigux/phase3_catalog.py --check-slug-sanity

      - name: Self-test Phase 3 shared helper
        run: python3 scripts/zigux/phase3_check_lib.py --self-test

      - name: Self-test Phase 3 runner
        run: python3 scripts/zigux/run-phase3-checks.py --self-test

      - name: Self-test Phase 3 wrapper generator
        run: python3 scripts/zigux/generate-phase3-check-wrappers.py --self-test

      - name: Validate Phase 3 wrapper templates
        run: python3 scripts/zigux/generate-phase3-check-wrappers.py --check

      - name: Self-test Phase 3 README tooling inventory checker
        run: python3 scripts/zigux/check-phase3-readme-tooling-inventory.py --self-test

      - name: Validate Phase 3 README tooling inventory
        run: python3 scripts/zigux/check-phase3-readme-tooling-inventory.py

      - name: Check Zig toolchain policy
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Check Phase 1 helper parity
        run: python3 scripts/zigux/check-phase1-parity.py

      - name: Self-test Phase 1 helper parity checker
        run: python3 scripts/zigux/check-phase1-parity.py --self-test

      - name: Self-test Phase 1 helper benchmark checker
        run: python3 scripts/zigux/check-phase1-bench.py --self-test

      - name: Check focused bitmap diff gate
        run: zig build test --build-file zigux/tests/bitmap_diff_build.zig --summary all

      - name: Check Phase 1 helper benchmark output
        run: python3 scripts/zigux/check-phase1-bench.py

      - name: Check bounded fixdep artifact parity and determinism
        run: python3 scripts/zigux/check-fixdep-diff.py

      - name: Self-test bounded genksyms bridge checker
        run: python3 scripts/zigux/check-genksyms-bridge.py --self-test

      - name: Check bounded genksyms bridge parity
        run: python3 scripts/zigux/check-genksyms-bridge.py

      - name: Self-test bounded genksyms CRC checker
        run: python3 scripts/zigux/check-genksyms-crc-diff.py --self-test

      - name: Check bounded genksyms CRC artifact parity and determinism
        run: python3 scripts/zigux/check-genksyms-crc-diff.py

      - name: Self-test bounded kconfig bridge checker
        run: python3 scripts/zigux/check-kconfig-bridge.py --self-test

      - name: Check bounded kconfig bridge parity
        run: python3 scripts/zigux/check-kconfig-bridge.py

      - name: Self-test bounded mk_elfconfig checker
        run: python3 scripts/zigux/check-mk-elfconfig-diff.py --self-test

      - name: Check bounded mk_elfconfig artifact parity and determinism
        run: python3 scripts/zigux/check-mk-elfconfig-diff.py

      - name: Check discovered Phase 3 parity
        run: python3 scripts/zigux/run-phase3-checks.py

      - name: Run bounded fixdep unit tests
        run: zig test scripts/zigux/fixdep.zig

      - name: Run bounded genksyms bridge unit tests
        run: zig test scripts/zigux/genksyms.zig

      - name: Run bounded genksyms CRC unit tests
        run: zig test scripts/zigux/genksyms_crc.zig

      - name: Run bounded conf bridge unit tests
        run: zig test scripts/zigux/kconfig/conf_bridge.zig

      - name: Run bounded confdata bridge unit tests
        run: zig test scripts/zigux/kconfig/confdata_bridge.zig

      - name: Run bounded mk_elfconfig unit tests
        run: zig test scripts/zigux/mk_elfconfig.zig

      - name: Run Phase 1 helper tests
        run: zig build test --build-file zigux/tests/build.zig

      - name: Run Phase 1 helper benchmark smoke
        run: zig build bench --build-file zigux/tests/build.zig -Doptimize=ReleaseSafe

      - name: Run Phase 3 ABI/interp substrate tests
        run: zig build phase3-test --build-file zigux/tests/build.zig

      - name: Run Phase 3 export/UAPI layout tests
        run: zig build phase3-export-uapi-layout-test --build-file zigux/tests/phase3_export_uapi_layout_build.zig

      - name: Run Phase 4 diff tests
        run: make -C zigux phase4-test

      - name: Validate Phase 5 reference sample packet
        run: make -C zigux phase5-validate

      - name: Run Phase 5 reference sample tests
        run: zig build test --build-file zigux/tests/phase5_build.zig --summary all

      - name: Validate Phase 6 leaf helper gates
        run: make -C zigux phase6-validate

      - name: Run Phase 6 leaf helper tests
        run: zig build test --build-file zigux/tests/phase6_build.zig --summary all

      - name: Run Phase 6 perf gates
        run: make -C zigux phase6-perf

      - name: Self-test Phase 7 runtime validator
        run: python3 scripts/zigux/validate-phase7.py --self-test

      - name: Validate Phase 7 runtime helper gates
        run: make -C zigux phase7-validate

      - name: Run Phase 7 runtime helper tests
        run: zig build test --build-file zigux/tests/phase7_build.zig --summary all

      - name: Self-test Phase 8 tooling validator
        run: python3 scripts/zigux/validate-phase8.py --self-test

      - name: Validate Phase 8 tooling gates
        run: make -C zigux phase8-validate

      - name: Run focused Phase 8 exec-cmd gates
        run: |
          zig test tools/lib/subcmd/exec-cmd.zig
          zig build test --build-file zigux/tests/phase8_exec_cmd_only_build.zig --summary all

      - name: Run focused Phase 8 help tests
        run: zig build test --build-file zigux/tests/phase8_help_only_build.zig --summary all

      - name: Run focused Phase 8 kallsyms tests
        run: zig build test --build-file zigux/tests/phase8_kallsyms_only_build.zig --summary all

      - name: Run focused Phase 8 libbpf segment survey tests
        run: |
          zig test zigux/tests/phase8_libbpf_segments.zig
          zig build test --build-file zigux/tests/phase8_libbpf_segments_only_build.zig --summary all

      - name: Run focused Phase 8 perf-buffer poll tests
        run: zig build test --build-file zigux/tests/phase8_perf_buffer_poll_only_build.zig --summary all

      - name: Run Phase 8 tooling tests
        run: zig build test --build-file zigux/tests/phase8_build.zig --summary all

      - name: Self-test Phase 9 runtime validator
        run: python3 scripts/zigux/validate-phase9.py --self-test

      - name: Validate Phase 9 runtime gates
        run: make -C zigux phase9-validate

      - name: Self-test Phase 10 shared validator
        run: python3 scripts/zigux/validate-phase10.py --self-test

      - name: Self-test Phase 10 harness coverage checker
        run: python3 scripts/zigux/check-phase10-harness-coverage.py --self-test

      - name: Validate Phase 10 focused harness coverage
        run: python3 scripts/zigux/check-phase10-harness-coverage.py

      - name: Validate Phase 10 closure evidence
        run: make -C zigux phase10-validate

      - name: Self-test Phase 11 simple-driver validator
        run: python3 scripts/zigux/validate-phase11.py --self-test

      - name: Self-test Phase 11 build inventory checker
        run: python3 scripts/zigux/check-phase11-build-inventory.py --self-test

      - name: Self-test Phase 11 hvc validation flow checker
        run: python3 scripts/zigux/check-phase11-hvc-validation-flow.py --self-test

      - name: Self-test Phase 11 hvc cleanup alignment checker
        run: python3 scripts/zigux/check-phase11-hvc-cleanup-alignment.py --self-test

      - name: Self-test Phase 11 layout assert surface checker
        run: python3 scripts/zigux/check-phase11-layout-assert-surface.py --self-test

      - name: Self-test Phase 11 shared replay contract checker
        run: python3 scripts/zigux/check-phase11-shared-replay-contract.py --self-test

      - name: Self-test Phase 11 header boundary packet checker
        run: python3 scripts/zigux/check-phase11-header-boundary-packet.py --self-test

      - name: Validate Phase 11 shared replay contract
        run: python3 scripts/zigux/check-phase11-shared-replay-contract.py

      - name: Validate Phase 11 header boundary packet
        run: python3 scripts/zigux/check-phase11-header-boundary-packet.py

      - name: Validate Phase 11 simple-driver bundle
        run: make -C zigux phase11-validate

      - name: Validate Phase 12 degraded-workflow bundle
        run: make -C zigux phase12-validate

      - name: Validate Phase 13 release-discipline packet
        run: make -C zigux phase13-validate

      - name: Run Phase 9 runtime helper tests
        run: zig build test --build-file zigux/tests/phase9_build.zig --summary all

      - name: Run Phase 10 virtio helper tests
        run: zig build test --build-file zigux/tests/phase10_build.zig --summary all

      - name: Run Phase 11 watchdog and console tests
        run: zig build test --build-file zigux/tests/phase11_build.zig --summary all

      - name: Run dedicated Phase 11 hvc survey replay
        run: make -C zigux phase11-hvc-survey

      - name: Run Phase 12 complex driver tests
        run: zig build test --build-file zigux/tests/phase12_build.zig --summary all

      - name: Run Phase 13 shared helper tests
        run: zig build test --build-file zigux/tests/phase13_build.zig --summary all

      - name: Validate Phase 14 shared smoke packet
        run: make -C zigux phase14-validate

      - name: Run Phase 14 smoke shard
        run: make -C zigux phase14-smoke

      - name: Run Phase 14 internal bridge tests
        run: zig build test --build-file zigux/tests/phase14_build.zig --summary all

      - name: Run Phase 15 governance tests
        run: make -C zigux phase15

  phase2-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig_target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - riscv64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --dest .zig-toolchain

      - name: Show Zig version
        run: zig version

      - name: Check Zig toolchain policy
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Self-test bounded Phase 2 cross-target checker
        run: python3 scripts/zigux/check-phase2-cross.py --self-test

      - name: Check bounded Phase 2 cross-target compile
        run: python3 scripts/zigux/check-phase2-cross.py --target ${{ matrix.zig_target }}
