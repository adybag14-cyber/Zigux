name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Self-test Zig installer
        run: python3 scripts/zigux/install-zig.py --self-test

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --channel 0.17.0-dev.87+9b177a7d2 --dest .zig-toolchain

      - name: Self-test Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check Zig toolchain
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Validate bootstrap files
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Validate Phase 1 helper files
        run: python3 scripts/zigux/validate-phase1.py

      - name: Self-test Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py --self-test

      - name: Check Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py

      - name: Self-test Phase 1 installer companion checks
        run: python3 scripts/zigux/check-phase1-installer-companion-checks.py --self-test

      - name: Check Phase 1 installer companion checks
        run: python3 scripts/zigux/check-phase1-installer-companion-checks.py

      - name: Self-test Phase 1 direct-owner markers
        run: python3 scripts/zigux/check-phase1-direct-owner-markers.py --self-test

      - name: Check Phase 1 direct-owner markers
        run: python3 scripts/zigux/check-phase1-direct-owner-markers.py

      - name: Self-test Phase 1 string review packet
        run: python3 scripts/zigux/check-phase1-string-review-packet.py --self-test

      - name: Check Phase 1 string review packet
        run: python3 scripts/zigux/check-phase1-string-review-packet.py

      - name: Validate Phase 1 closure
        run: python3 scripts/zigux/validate-phase1-closure.py

      - name: Check Phase 1 parity gate
        run: python3 scripts/zigux/check-phase1-parity.py

      - name: Run Phase 1 helper tests
        run: zig build test --build-file zigux/tests/build.zig

      - name: Check Phase 1 bench gate
        run: python3 scripts/zigux/check-phase1-bench.py

      - name: Run Phase 1 helper bench smoke
        run: zig build bench --build-file zigux/tests/build.zig -Doptimize=ReleaseSafe

      - name: Validate Phase 2 toolchain packet
        run: python3 scripts/zigux/validate-phase2.py

      - name: Self-test Phase 2 fixdep gate checker
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py --self-test

      - name: Check Phase 2 fixdep gate packet
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py

      - name: Self-test Phase 2 fixdep diff checker
        run: python3 scripts/zigux/check-fixdep-diff.py --self-test

      - name: Check Phase 2 fixdep diff packet
        run: python3 scripts/zigux/check-fixdep-diff.py

      - name: Run Phase 2 fixdep unit tests
        run: zig test scripts/zigux/fixdep.zig

      - name: Validate Phase 2 closure
        run: python3 scripts/zigux/validate-phase2-closure.py

      - name: Self-test Phase 2 tests README alignment
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py --self-test

      - name: Check Phase 2 tests README alignment
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py

      - name: Self-test Phase 2 kconfig selftest alignment
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py --self-test

      - name: Check Phase 2 kconfig selftest alignment
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py

      - name: Self-test Phase 2 kconfig README alignment
        run: python3 scripts/zigux/check-phase2-kconfig-readme-alignment.py --self-test

      - name: Check Phase 2 kconfig README alignment
        run: python3 scripts/zigux/check-phase2-kconfig-readme-alignment.py

      - name: Self-test Phase 2 confdata helper-anchor alignment
        run: python3 scripts/zigux/check-phase2-confdata-helper-anchor-alignment.py --self-test

      - name: Check Phase 2 confdata helper-anchor alignment
        run: python3 scripts/zigux/check-phase2-confdata-helper-anchor-alignment.py

      - name: Self-test Phase 2 kconfig bridge checker
        run: python3 scripts/zigux/check-kconfig-bridge.py --self-test

      - name: Check Phase 2 kconfig bridge packet
        run: python3 scripts/zigux/check-kconfig-bridge.py

      - name: Run Phase 2 conf bridge unit tests
        run: zig test scripts/zigux/kconfig/conf_bridge.zig

      - name: Run Phase 2 confdata bridge unit tests
        run: zig test scripts/zigux/kconfig/confdata_bridge.zig

      - name: Self-test Phase 2 cross-target compile checker
        run: python3 scripts/zigux/check-phase2-cross.py --self-test

      - name: Self-test Phase 2 cross-selftest alignment
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py --self-test

      - name: Check Phase 2 cross-selftest alignment
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py

      - name: Self-test Phase 2 toolchain pin scope
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py --self-test

      - name: Check Phase 2 toolchain pin scope
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py

      - name: Self-test Phase 2 genksyms bridge checker
        run: python3 scripts/zigux/check-genksyms-bridge.py --self-test

      - name: Check Phase 2 genksyms bridge packet
        run: python3 scripts/zigux/check-genksyms-bridge.py

      - name: Run Phase 2 genksyms unit tests
        run: zig test scripts/zigux/genksyms.zig

      - name: Validate Phase 3 slices
        run: python3 scripts/zigux/validate-phase3.py

      - name: Run Phase 3 validator-support selftest packet
        run: python3 scripts/zigux/validate_phase3_selftest.py

      - name: Self-test Phase 3 validator-support surface
        run: python3 scripts/zigux/validate-phase3-validator-support-surface.py --self-test

      - name: Validate Phase 3 validator-support surface
        run: python3 scripts/zigux/validate-phase3-validator-support-surface.py

      - name: Validate Phase 3 ABI bindings syntax
        run: python3 scripts/zigux/validate-phase3-abi-bindings-syntax.py

      - name: Survey Phase 3 ABI constant parity
        run: python3 scripts/zigux/survey-phase3-abi-constant-parity.py

      - name: Validate Phase 3 ABI header-family survey
        run: python3 scripts/zigux/validate-phase3-abi-header-family-survey.py

      - name: Check Phase 3 selftest review surface
        run: python3 scripts/zigux/check-phase3-selftest-surface.py

      - name: Validate Phase 3 policy/unsafe survey
        run: python3 scripts/zigux/validate-phase3-policy-unsafe-survey.py

      - name: Check Phase 3 policy-byte guards
        run: python3 scripts/zigux/check-phase3-policy-byte-guards.py

      - name: Validate Phase 3 export/UAPI survey
        run: python3 scripts/zigux/validate-phase3-export-uapi-survey.py

      - name: Validate Phase 3 low-level wrapper survey
        run: python3 scripts/zigux/validate-phase3-low-level-wrapper-survey.py

      - name: Check Phase 3 ABI dump gate
        run: python3 scripts/zigux/check-phase3-abi-dump-gate.py

      - name: Check Phase 3 ABI interop packet
        run: python3 scripts/zigux/check-phase3-abi.py

      - name: Run Phase 3 ABI compile proof
        run: zig build phase3-test --build-file zigux/tests/build.zig

      - name: Run Phase 3 export/UAPI layout proof
        run: zig build phase3-export-uapi-layout-test --build-file zigux/tests/phase3_export_uapi_layout_build.zig

      - name: Run Phase 3 ABI dump replay
        run: zig build phase3-dump --build-file zigux/tests/build.zig

      - name: Run Phase 3 low-level wrapper compile proof
        run: zig build phase3-low-level-wrappers-test --build-file zigux/tests/phase3_low_level_wrappers_build.zig

      - name: Validate Phase 4 rollback routes
        run: make -C zigux phase4-validate

      - name: Run Phase 4 rollback tests
        run: make -C zigux phase4-test

      - name: Self-test Phase 6 shared-surface checker
        run: python3 scripts/zigux/check-phase6-shared-surface.py --self-test

      - name: Check Phase 6 shared helper surface
        run: python3 scripts/zigux/check-phase6-shared-surface.py

      - name: Run Phase 6 base64 C parity packet
        run: python3 scripts/zigux/check-phase6-base64-c-parity.py

      - name: Run Phase 6 bsearch focused packet
        run: make -C zigux phase6-bsearch-test

      - name: Self-test Phase 6 checksum C parity checker
        run: python3 scripts/zigux/check-phase6-checksum-c-parity.py --self-test

      - name: Check Phase 6 checksum C parity packet
        run: python3 scripts/zigux/check-phase6-checksum-c-parity.py

      - name: Self-test Phase 6 perf-threshold checker
        run: python3 scripts/zigux/check-phase6-perf-threshold-markers.py --self-test

      - name: Check Phase 6 perf threshold markers
        run: python3 scripts/zigux/check-phase6-perf-threshold-markers.py

      - name: Run Phase 6 hexdump perf gate
        run: make -C zigux phase6-hexdump-perf

      - name: Validate Phase 7 helper routes
        run: make -C zigux phase7-validate

      - name: Run Phase 7 helper tests
        run: make -C zigux phase7-test

      - name: Validate Phase 8 tooling routes
        run: make -C zigux phase8-validate

      - name: Run Phase 8 tooling tests
        run: make -C zigux phase8-test

      - name: Run Phase 9 runtime shared tests
        run: make -C zigux phase9-test

      - name: Validate Phase 10 virtio routes
        run: make -C zigux phase10-validate

      - name: Run Phase 10 virtio tests
        run: make -C zigux phase10-test

      - name: Validate Phase 11 shared routes
        run: make -C zigux phase11-contract

      - name: Run Phase 11 shared tests
        run: make -C zigux phase11-test

      - name: Validate Phase 12 complex-driver routes
        run: make -C zigux phase12-validate

      - name: Run Phase 12 smoke routes
        run: make -C zigux phase12-smoke

      - name: Run Phase 12 shared tests
        run: make -C zigux phase12-test

      - name: Validate Phase 13 release routes
        run: make -C zigux phase13-validate

      - name: Run Phase 13 release tests
        run: make -C zigux phase13-test

      - name: Validate Phase 14 smoke routes
        run: make -C zigux phase14-validate

      - name: Run Phase 14 smoke routes
        run: make -C zigux phase14-smoke

      - name: Run Phase 14 shared tests
        run: make -C zigux phase14-test

      - name: Validate Phase 15 governance routes
        run: make -C zigux phase15-validate

      - name: Run Phase 15 governance tests
        run: make -C zigux phase15-test

  phase2_cross_scope:
    needs: bootstrap
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Decide Phase 2 cross scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git show --pretty='' --name-only "${{ github.sha }}")"
            else
              changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/zigux-bootstrap\.yml|scripts/zigux/install-zig\.py|scripts/zigux/check-phase2-cross\.py|scripts/zigux/check-phase2-cross-selftest-alignment\.py|scripts/zigux/fixdep\.zig|scripts/zigux/genksyms\.zig|scripts/zigux/kconfig/conf_bridge\.zig|scripts/zigux/kconfig/confdata_bridge\.zig|scripts/zigux/zig-toolchain-policy\.json|zigux/Makefile|zigux/tests/fixtures/phase2_cross_targets\.json)$'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  phase2-cross:
    if: needs.phase2_cross_scope.outputs.should_run == 'true'
    needs: [bootstrap, phase2_cross_scope]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig_target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - riscv64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --channel 0.17.0-dev.87+9b177a7d2 --dest .zig-toolchain

      - name: Check bounded Phase 2 cross-target compile
        run: python3 scripts/zigux/check-phase2-cross.py --target ${{ matrix.zig_target }}