name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Self-test Zig installer
        run: python3 scripts/zigux/install-zig.py --self-test
      - name: Install Zig
        run: python3 scripts/zigux/install-zig.py --channel 0.17.0-dev.87+9b177a7d2 --dest .zig-toolchain

      - name: Self-test Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check Zig toolchain
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Validate bootstrap files
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Validate Phase 1 helper files
        run: python3 scripts/zigux/validate-phase1.py

      - name: Self-test Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py --self-test

      - name: Check Phase 1 installer-review surfaces
        run: python3 scripts/zigux/check-phase1-installer-review-surfaces.py

      - name: Self-test Phase 1 installer companion checks
        run: python3 scripts/zigux/check-phase1-installer-companion-checks.py --self-test

