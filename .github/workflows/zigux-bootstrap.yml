name: zigux-bootstrap

on:
  push:
    branches: [ master ]
    paths:
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'zigux/tests/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'zigux/tests/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: master

      - name: Validate bootstrap files
        run: python3 scripts/zigux/validate-bootstrap.py

      - name: Validate Phase 1 helper files
        run: python3 scripts/zigux/validate-phase1.py

      - name: Check Zig toolchain policy
        run: python3 scripts/zigux/check-zig-toolchain.py

      - name: Run Phase 1 helper tests
        run: zig build test --build-file zigux/tests/build.zig
