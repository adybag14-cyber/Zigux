name: zigux-bootstrap
# Keep this lane tied to files that the current checkout actually contains.
# Run every master push so exact-head bootstrap status stays attached even when path filtering misses a live change.

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'third_party/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace snapshot
        run: |
          set -euxo pipefail
          tmpdir="$(mktemp -d)"
          archive="$tmpdir/source.tar.gz"
          curl -L --fail "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" -o "$archive"
          tar -xzf "$archive" -C "$tmpdir"
          src_dir="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          shopt -s dotglob
          mv "$src_dir"/* "$GITHUB_WORKSPACE"/

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Self-test current Lane 05 archive parts packet checker
        run: python3 scripts/zigux/check-lane05-archive-parts-packet.py --self-test

      - name: Check current Lane 05 archive parts packet
        run: python3 scripts/zigux/check-lane05-archive-parts-packet.py --allow-missing

      - name: Self-test current Lane 05 archive-parts bootstrap workflow checker
        run: python3 scripts/zigux/check-lane05-archive-parts-bootstrap-workflow.py --self-test

      - name: Check current Lane 05 archive-parts bootstrap workflow packet
        run: python3 scripts/zigux/check-lane05-archive-parts-bootstrap-workflow.py

      - name: Setup pinned Zig toolchain
        run: |
          set -euxo pipefail
          eval "$(python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          targets = policy["upgrade_policy"]["archive_target_scope"]
          if len(targets) != 1:
              raise SystemExit(f"expected exactly one pinned archive target, got {len(targets)}")
          target = targets[0]
          channel = policy["channel"]
          filename = f"zig-{target}-{channel}.tar.xz"
          url = f"https://ziglang.org/builds/{filename}"
          print(f"ZIGUX_ZIG_TARGET='{target}'")
          print(f"ZIGUX_ZIG_CHANNEL='{channel}'")
          print(f"ZIGUX_ZIG_FILENAME='{filename}'")
          print(f"ZIGUX_ZIG_URL='{url}'")
          PY
          )"
          mkdir -p .zig-toolchain
          archive_path=".zig-toolchain/$ZIGUX_ZIG_FILENAME"
          extract_root="$GITHUB_WORKSPACE/.zig-toolchain/zig-$ZIGUX_ZIG_TARGET-$ZIGUX_ZIG_CHANNEL"
          mirror_file=".zig-toolchain/community-mirrors.txt"
          repo_archive_path="third_party/$ZIGUX_ZIG_FILENAME"
          repo_archive_parts_dir="${repo_archive_path}.parts"
          rm -f "$archive_path" "$mirror_file"
          rm -rf "$extract_root"
          try_local_archive() {
            if [ ! -f "$repo_archive_path" ]; then
              if [ ! -d "$repo_archive_parts_dir" ]; then
                return 1
              fi
              python3 scripts/zigux/stage-pinned-zig-archive.py                 --root "$GITHUB_WORKSPACE"                 --parts-dir "$repo_archive_parts_dir" || return 1
            fi
            if python3 scripts/zigux/check-zig-toolchain.py --archive-only --archive "$repo_archive_path" --archive-target "$ZIGUX_ZIG_TARGET"; then
              tar -xJf "$repo_archive_path" -C .zig-toolchain
              zig_path="$extract_root/zig"
              if python3 scripts/zigux/check-zig-toolchain.py --zig "$zig_path"; then
                return 0
              fi
            fi
            rm -rf "$extract_root"
            return 1
          }
          try_download() {
            local url="$1"
            if curl -L --fail "$url" -o "$archive_path"; then
              if python3 scripts/zigux/check-zig-toolchain.py --archive-only --archive "$archive_path" --archive-target "$ZIGUX_ZIG_TARGET"; then
                tar -xJf "$archive_path" -C .zig-toolchain
                zig_path="$extract_root/zig"
                if python3 scripts/zigux/check-zig-toolchain.py --zig "$zig_path"; then
                  return 0
                fi
              fi
              rm -f "$archive_path"
              rm -rf "$extract_root"
            fi
            return 1
          }
          download_success=0
          if try_local_archive; then
            download_success=1
          elif curl -L --fail https://ziglang.org/download/community-mirrors.txt -o "$mirror_file"; then
            while IFS= read -r mirror_url; do
              [ -n "$mirror_url" ] || continue
              if try_download "${mirror_url%/}/$ZIGUX_ZIG_FILENAME?source=github-zigux-bootstrap"; then
                download_success=1
                break
              fi
            done < "$mirror_file"
          fi
          if [ "$download_success" -ne 1 ]; then
            if try_download "$ZIGUX_ZIG_URL"; then
              download_success=1
            fi
          fi
          if [ "$download_success" -ne 1 ]; then
            echo 'failed to install a verified pinned Zig archive from third_party, mirrors, or ziglang.org' >&2
            exit 1
          fi
          zig_path="$extract_root/zig"
          echo "$extract_root" >> "$GITHUB_PATH"
          "$zig_path" version

      - name: Compile current scripts
        run: |
          set -euxo pipefail
          mapfile -t scripts < <(find scripts/zigux -maxdepth 1 -type f -name '*.py' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo 'no Python scripts found under scripts/zigux' >&2
            exit 1
          fi
          python3 -m py_compile "${scripts[@]}"

      - name: Self-test current Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check current Zig toolchain policy packet
        run: python3 scripts/zigux/check-zig-toolchain.py --policy-only

      - name: Check current pinned Zig archive packet
        run: python3 scripts/zigux/check-zig-toolchain.py --archive-only --allow-missing

      - name: Self-test current Lane 05 local-first archive checker
        run: python3 scripts/zigux/check-lane05-local-first-archive-workflow.py --self-test

      - name: Check current Lane 05 local-first archive packet
        run: python3 scripts/zigux/check-lane05-local-first-archive-workflow.py

      - name: Self-test current Lane 05 local archive README checker
        run: python3 scripts/zigux/check-lane05-local-archive-readme.py --self-test

      - name: Check current Lane 05 local archive README packet
        run: python3 scripts/zigux/check-lane05-local-archive-readme.py

      - name: Self-test current Lane 05 install-zig archive verification checker
        run: python3 scripts/zigux/check-lane05-install-zig-archive-verification.py --self-test

      - name: Check current Lane 05 install-zig archive verification packet
        run: python3 scripts/zigux/check-lane05-install-zig-archive-verification.py

      - name: Self-test current Zig installer helper
        run: python3 scripts/zigux/install-zig.py --self-test

      - name: Self-test current staged pinned Zig archive helper
        run: python3 scripts/zigux/stage-pinned-zig-archive.py --self-test

      - name: Self-test current Lane 05 stage helper contract checker
        run: python3 scripts/zigux/check-lane05-stage-helper-contract.py --self-test

      - name: Check current Lane 05 stage helper contract packet
        run: python3 scripts/zigux/check-lane05-stage-helper-contract.py

      - name: Self-test current Lane 05 stage helper selftest checker
        run: python3 scripts/zigux/check-lane05-stage-helper-selftest.py --self-test

      - name: Check current Lane 05 stage helper selftest packet
        run: python3 scripts/zigux/check-lane05-stage-helper-selftest.py

      - name: Self-test current Phase 2 fixdep gate checker
        run: python3 scripts/zigux/check-phase2-fixdep-gate.py --self-test

