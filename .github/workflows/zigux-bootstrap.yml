name: zigux-bootstrap
# Keep this lane tied to files that the current checkout actually contains.
# Run every master push so exact-head bootstrap status stays attached even when path filtering misses a live change.

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'third_party/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace snapshot
        run: |
          set -euxo pipefail
          tmpdir="$(mktemp -d)"
          archive="$tmpdir/source.tar.gz"
          curl -L --fail "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" -o "$archive"
          tar -xzf "$archive" -C "$tmpdir"
          src_dir="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          shopt -s dotglob
          mv "$src_dir"/* "$GITHUB_WORKSPACE"/

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Setup pinned Zig toolchain
        run: |
          set -euxo pipefail
          eval "$(python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          targets = policy["upgrade_policy"]["archive_target_scope"]
          target = "x86_64-linux"
          if target not in targets:
              raise SystemExit(f"missing required Linux CI archive target: {target}")
          channel = policy["channel"]
          filename = f"zig-{target}-{channel}.tar.xz"
          canonical_repo = "adybag14-cyber/zig"
          canonical_tag = "upstream-64dfaa568db0"
          url = f"https://ziglang.org/builds/{filename}"
          canonical_url = f"https://github.com/{canonical_repo}/releases/download/{canonical_tag}/{filename}"
          print(f"ZIGUX_ZIG_TARGET='{target}'")
          print(f"ZIGUX_ZIG_CHANNEL='{channel}'")
          print(f"ZIGUX_ZIG_FILENAME='{filename}'")
          print(f"ZIGUX_ZIG_URL='{url}'")
          print(f"ZIGUX_ZIG_CANONICAL_URL='{canonical_url}'")
          PY
          )"
          mkdir -p .zig-toolchain
          archive_path=".zig-toolchain/$ZIGUX_ZIG_FILENAME"
          extract_root="$GITHUB_WORKSPACE/.zig-toolchain/zig-$ZIGUX_ZIG_TARGET-$ZIGUX_ZIG_CHANNEL"
          mirror_file=".zig-toolchain/community-mirrors.txt"
          repo_archive_path="third_party/$ZIGUX_ZIG_FILENAME"
          repo_archive_parts_dir="${repo_archive_path}.parts"
          rm -f "$archive_path" "$mirror_file"
          rm -rf "$extract_root"
          verify_pinned_archive_sha256() {
            local archive="$1"
            python3 - "$archive" "$ZIGUX_ZIG_TARGET" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          archive, target = sys.argv[1], sys.argv[2]
          policy = json.loads(Path("scripts/zigux/zig-toolchain-policy.json").read_text(encoding="utf-8"))
          expected = policy["archive_sha256"][target]
          actual = hashlib.sha256(Path(archive).read_bytes()).hexdigest()
          if actual != expected:
              print(f"pinned archive sha256 mismatch: expected {expected}, got {actual}", file=sys.stderr)
              raise SystemExit(1)
          PY
          }
          activate_extracted_zig() {
            zig_path="$extract_root/zig"
            export PATH="$extract_root:$PATH"
          }
          ensure_bootstrap_zig() {
            if command -v zig >/dev/null 2>&1; then
              return 0
            fi
            if [ -x "$extract_root/zig" ]; then
              activate_extracted_zig
              return 0
            fi
            if [ ! -f "$archive_path" ]; then
              curl --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 3 \
                --connect-timeout 20 \
                --speed-limit 1024 \
                --speed-time 30 \
                "$ZIGUX_ZIG_CANONICAL_URL" \
                -o "$archive_path" || return 1
            fi
            verify_pinned_archive_sha256 "$archive_path" || return 1
            rm -rf "$extract_root"
            tar -xJf "$archive_path" -C .zig-toolchain || return 1
            activate_extracted_zig
          }
          verify_and_activate_archive() {
            local archive="$1"
            verify_pinned_archive_sha256 "$archive" || return 1
            rm -rf "$extract_root"
            tar -xJf "$archive" -C .zig-toolchain || return 1
            activate_extracted_zig
          }
          try_local_archive() {
            if [ ! -f "$repo_archive_path" ]; then
              if [ ! -d "$repo_archive_parts_dir" ]; then
                return 1
              fi
              ensure_bootstrap_zig || return 1
              zig run scripts/zigux/stage_pinned_zig_archive.zig -- --root "$GITHUB_WORKSPACE" --parts-dir "$repo_archive_parts_dir" || return 1
            fi
            verify_and_activate_archive "$repo_archive_path" || return 1
            if zig run scripts/zigux/check_zig_toolchain.zig -- --archive-only --archive "$repo_archive_path" --archive-target "$ZIGUX_ZIG_TARGET"; then
              if zig run scripts/zigux/check_zig_toolchain.zig -- --zig "$zig_path"; then
                return 0
              fi
            fi
            rm -rf "$extract_root"
            return 1
          }
          try_download() {
            local url="$1"
            if curl --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 20 \
              --speed-limit 1024 \
              --speed-time 30 \
              "$url" \
              -o "$archive_path"; then
              verify_and_activate_archive "$archive_path" || {
                rm -f "$archive_path"
                rm -rf "$extract_root"
                return 1
              }
              if zig run scripts/zigux/check_zig_toolchain.zig -- --archive-only --archive "$archive_path" --archive-target "$ZIGUX_ZIG_TARGET"; then
                if zig run scripts/zigux/check_zig_toolchain.zig -- --zig "$zig_path"; then
                  return 0
                fi
              fi
              rm -f "$archive_path"
              rm -rf "$extract_root"
            fi
            return 1
          }
          download_success=0
          if try_local_archive; then
            download_success=1
          elif try_download "$ZIGUX_ZIG_CANONICAL_URL"; then
            download_success=1
          elif curl --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --speed-limit 1024 \
            --speed-time 30 \
            https://ziglang.org/download/community-mirrors.txt \
            -o "$mirror_file"; then
            while IFS= read -r mirror_url; do
              [ -n "$mirror_url" ] || continue
              if try_download "${mirror_url%/}/$ZIGUX_ZIG_FILENAME?source=github-zigux-bootstrap"; then
                download_success=1
                break
              fi
            done < "$mirror_file"
          fi
          if [ "$download_success" -ne 1 ]; then
            if try_download "$ZIGUX_ZIG_URL"; then
              download_success=1
            fi
          fi
          if [ "$download_success" -ne 1 ]; then
            echo 'failed to install a verified pinned Zig archive from third_party, canonical adybag14-cyber/zig release, mirrors, or ziglang.org' >&2
            exit 1
          fi
          zig_path="$extract_root/zig"
          real_zig_path="$extract_root/zig.real"
          mv "$zig_path" "$real_zig_path"
          cat > "$zig_path" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          real_zig="${ZIGUX_REAL_ZIG:?ZIGUX_REAL_ZIG is not set}"
          if [ "${1:-}" = "run" ]; then
            has_separator=0
            for arg in "$@"; do
              if [ "$arg" = "--" ]; then
                has_separator=1
                break
              fi
            done
            if [ "$has_separator" -eq 0 ]; then
              args=("$@")
              for ((index = 2; index < ${#args[@]}; index++)); do
                if [ "${args[$index]}" = "--self-test" ]; then
                  exec "$real_zig" "${args[@]:0:$index}" -- "${args[@]:$index}"
                fi
              done
            fi
          fi
          exec "$real_zig" "$@"
          SH
          chmod +x "$zig_path"
          export ZIGUX_REAL_ZIG="$real_zig_path"
          echo "ZIGUX_REAL_ZIG=$real_zig_path" >> "$GITHUB_ENV"
          echo "$extract_root" >> "$GITHUB_PATH"
          "$zig_path" version

      - name: Validate current Zig bootstrap helpers
        run: |
          set -euxo pipefail
          zig test scripts/zigux/toolchain_policy.zig
          zig test scripts/zigux/toolchain_resolver.zig
          zig test scripts/zigux/check_zig_toolchain.zig
          zig test scripts/zigux/stage_pinned_zig_archive.zig
          zig test scripts/zigux/install_zig.zig

      - name: Self-test current Zig toolchain checker
        run: zig run scripts/zigux/check_zig_toolchain.zig -- --self-test

      - name: Check current Zig toolchain policy packet
        run: zig run scripts/zigux/check_zig_toolchain.zig -- --policy-only

      - name: Check current pinned Zig archive packet
