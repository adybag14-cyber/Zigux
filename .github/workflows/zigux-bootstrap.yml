name: zigux-bootstrap
# Keep this lane tied to files that the current checkout actually contains.

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'zigux-alpha/**'
      - 'Documentation/zigux/**'
      - 'samples/zigux/**'
      - 'kernel/**/*.zig'
      - 'net/**/*.zig'
      - 'drivers/**/*.zig'
      - 'scripts/basic/fixdep.c'
      - 'scripts/include/xalloc.h'
      - 'scripts/kconfig/conf.c'
      - 'scripts/kconfig/confdata.c'
      - 'scripts/zigux/**'
      - 'tools/lib/*.zig'
      - 'tools/lib/**/*.zig'
      - 'tools/lib/subcmd/exec-cmd.c'
      - 'tools/lib/subcmd/help.c'
      - 'tools/lib/symbol/kallsyms.c'
      - 'zigux/**'
      - 'include/linux/zigux.h'
      - 'include/zigux/**'
      - '.github/workflows/zigux-bootstrap.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Compile current scripts
        run: |
          set -euxo pipefail
          mapfile -t scripts < <(find scripts/zigux -maxdepth 1 -type f -name '*.py' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo 'no Python scripts found under scripts/zigux' >&2
            exit 1
          fi
          python3 -m py_compile "${scripts[@]}"

      - name: Self-test current Zig toolchain checker
        run: python3 scripts/zigux/check-zig-toolchain.py --self-test

      - name: Check current Zig toolchain policy packet
        run: python3 scripts/zigux/check-zig-toolchain.py --policy-only

      - name: Check current pinned Zig archive packet
        run: python3 scripts/zigux/check-zig-toolchain.py --archive-only --allow-missing

      - name: Self-test current Phase 2 kconfig bridge checker
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py --self-test

      - name: Check current Phase 2 kconfig bridge packet
        run: python3 scripts/zigux/check-phase2-kconfig-selftest-alignment.py

      - name: Self-test current Phase 2 kbuild routes checker
        run: python3 scripts/zigux/check-phase2-kbuild-routes.py --self-test

      - name: Check current Phase 2 kbuild packet
        run: python3 scripts/zigux/check-phase2-kbuild-routes.py

      - name: Self-test current Phase 2 tests README checker
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py --self-test

      - name: Check current Phase 2 tests README packet
        run: python3 scripts/zigux/check-phase2-tests-readme-alignment.py

      - name: Self-test current Phase 2 cross selftest alignment checker
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py --self-test

      - name: Check current Phase 2 cross alignment packet
        run: python3 scripts/zigux/check-phase2-cross-selftest-alignment.py

      - name: Self-test current Phase 2 toolchain pinning checker
        run: python3 scripts/zigux/check-phase2-toolchain-pinning.py --self-test

      - name: Check current Phase 2 toolchain pinning packet
        run: python3 scripts/zigux/check-phase2-toolchain-pinning.py

      - name: Self-test current Phase 2 toolchain pin-scope checker
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py --self-test

      - name: Check current Phase 2 toolchain pin-scope packet
        run: python3 scripts/zigux/check-phase2-toolchain-pin-scope.py

      - name: Self-test current Phase 2 required make-routes checker
        run: python3 scripts/zigux/check-phase2-required-make-routes.py --self-test

      - name: Check current Phase 2 required make routes
        run: python3 scripts/zigux/check-phase2-required-make-routes.py

      - name: Self-test current Phase 2 mk_elfconfig checker
        run: python3 scripts/zigux/check-mk-elfconfig-diff.py --self-test

      - name: Check current Phase 2 mk_elfconfig packet
        run: python3 scripts/zigux/check-mk-elfconfig-diff.py

      - name: Self-test current Phase 2 mk_elfconfig non-ELF first-header checker
        run: python3 scripts/zigux/check-mk-elfconfig-non-elf-first-header-markers.py --self-test

      - name: Check current Phase 2 mk_elfconfig non-ELF first-header packet
        run: python3 scripts/zigux/check-mk-elfconfig-non-elf-first-header-markers.py

      - name: Self-test current Phase 2 mk_elfconfig fd double-ELF checker
        run: python3 scripts/zigux/check-mk-elfconfig-fd-double-elf-markers.py --self-test

      - name: Check current Phase 2 mk_elfconfig fd double-ELF packet
        run: python3 scripts/zigux/check-mk-elfconfig-fd-double-elf-markers.py

      - name: Self-test current Phase 2 mk_elfconfig fd double same-class ELF checker
        run: python3 scripts/zigux/check-mk-elfconfig-fd-double-same-class-elf-markers.py --self-test

      - name: Check current Phase 2 mk_elfconfig fd double same-class ELF packet
        run: python3 scripts/zigux/check-mk-elfconfig-fd-double-same-class-elf-markers.py

      - name: Self-test current Phase 1 direct-owner checker
        run: python3 scripts/zigux/check-phase1-direct-owner-markers.py --self-test

      - name: Check current Phase 1 direct-owner markers
        run: python3 scripts/zigux/check-phase1-direct-owner-markers.py

      - name: Self-test current Phase 1 string review checker
        run: python3 scripts/zigux/check-phase1-string-review-packet.py --self-test

      - name: Check current Phase 1 string review packet
        run: python3 scripts/zigux/check-phase1-string-review-packet.py

      - name: Self-test current Phase 1 bench checker
        run: python3 scripts/zigux/check-phase1-bench.py --self-test

      - name: Self-test current Phase 1 shared reminder checker
        run: python3 scripts/zigux/check-phase1-shared-reminder-packet.py --self-test

      - name: Check current Phase 1 shared reminder packet
        run: python3 scripts/zigux/check-phase1-shared-reminder-packet.py

      - name: Self-test current Phase 4 repo-reality warning checker
        run: python3 scripts/zigux/check-phase4-repo-reality-warning.py --self-test

      - name: Check current Phase 4 repo-reality warning packet
        run: python3 scripts/zigux/check-phase4-repo-reality-warning.py

      - name: Self-test current Phase 4 reversible-delivery pin checker
        run: python3 scripts/zigux/check-phase4-reversible-delivery-pins.py --self-test

      - name: Check current Phase 4 reversible-delivery pin packet
        run: python3 scripts/zigux/check-phase4-reversible-delivery-pins.py

      - name: Self-test current Phase 4 tests README checker
        run: python3 scripts/zigux/check-phase4-tests-readme-packet.py --self-test

      - name: Check current Phase 4 tests README packet
        run: python3 scripts/zigux/check-phase4-tests-readme-packet.py

      - name: Self-test current Phase 7 shared-control gap checker
        run: python3 scripts/zigux/check-phase7-shared-control-gap.py --self-test

      - name: Check current Phase 7 shared-control gap packet
        run: python3 scripts/zigux/check-phase7-shared-control-gap.py

      - name: Self-test current Phase 10 bootstrap route checker
        run: python3 scripts/zigux/check-phase10-bootstrap-route.py --self-test

      - name: Check current Phase 10 bootstrap route
        run: python3 scripts/zigux/check-phase10-bootstrap-route.py

      - name: Validate Phase 10 checker-backed review packet
        run: make -C zigux phase10-validate

      - name: Run Phase 10 helper tests
        run: make -C zigux phase10-test

      - name: Self-test current Phase 11 HVC cleanup current-head checker
        run: python3 scripts/zigux/check-phase11-hvc-cleanup-current-head.py --self-test

      - name: Check current Phase 11 HVC cleanup current-head packet
        run: python3 scripts/zigux/check-phase11-hvc-cleanup-current-head.py

      - name: Self-test current Phase 11 build inventory checker
        run: python3 scripts/zigux/check-phase11-build-inventory.py --self-test

      - name: Check current Phase 11 build inventory packet
        run: python3 scripts/zigux/check-phase11-build-inventory.py

      - name: Self-test current Phase 11 matrix-gap survey checker
        run: python3 scripts/zigux/check-phase11-matrix-gap-survey.py --self-test

      - name: Check current Phase 11 matrix-gap survey packet
        run: python3 scripts/zigux/check-phase11-matrix-gap-survey.py

      - name: Self-test current Phase 12 build-only surface checker
        run: python3 scripts/zigux/check-build-only-phase12-surface.py --self-test

      - name: Check current Phase 12 build-only surface
        run: python3 scripts/zigux/check-build-only-phase12-surface.py

      - name: Self-test current Phase 12 release-readiness packet checker
        run: python3 scripts/zigux/check-phase12-release-readiness-packet.py --self-test

      - name: Validate Phase 12 degraded-workflow bundle
        run: make -C zigux phase12-validate

      - name: Check current Phase 12 release-readiness packet
        run: python3 scripts/zigux/check-phase12-release-readiness-packet.py

      - name: Run focused Phase 12 smoke shard
        run: make -C zigux phase12-smoke

      - name: Run Phase 12 complex driver tests
        run: zig build test --build-file zigux/tests/phase12_build.zig --summary all

      - name: Validate Phase 8 tooling gates
        run: make -C zigux phase8-validate

      - name: Run focused Phase 8 libbpf segment survey tests
        run: zig build test --build-file zigux/tests/phase8_libbpf_segments_only_build.zig --summary all

      - name: Check current docs-root sanity markers
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          required_files = [
              Path('.github/workflows/zigux-bootstrap.yml'),
              Path('Documentation/zigux/README.md'),
              Path('Documentation/zigux/phase12-release-readiness-survey.md'),
              Path('zigux/tests/README.md'),
              Path('scripts/zigux/check-build-only-phase12-surface.py'),
          ]
          missing = [str(path) for path in required_files if not path.exists()]
          if missing:
              raise SystemExit('missing required files: ' + ', '.join(missing))

          survey = Path('Documentation/zigux/phase12-release-readiness-survey.md').read_text(encoding='utf-8')
          markers = [
              '`PHASE12_STATUS=active`',
              '`PHASE12_RELEASE_CLOSED=no`',
              'shared-summary lane owner: `pmo-release`',
              'shared build-only contract guard: `scripts/zigux/check-build-only-phase12-surface.py`',
          ]
          missing_markers = [marker for marker in markers if marker not in survey]
          if missing_markers:
              raise SystemExit('missing survey markers: ' + ', '.join(missing_markers))

          print('ZIGUX_BOOTSTRAP_SANITY=pass')
          print(f'ZIGUX_BOOTSTRAP_REQUIRED_FILE_COUNT={len(required_files)}')
          print(f'ZIGUX_BOOTSTRAP_MARKER_COUNT={len(markers)}')
          PY2
