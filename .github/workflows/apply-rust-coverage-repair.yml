name: Apply Rust coverage repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-rust-coverage-repair.yml
      - .github/scripts/apply_rust_coverage_repair.py

permissions:
  contents: write

concurrency:
  group: apply-rust-coverage-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply assertion-checked Rust coverage fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_rust_coverage_repair.py
          python3 -m py_compile \
            .github/scripts/kernel_coverage.py \
            .github/scripts/test_full_linux_coverage.py
          python3 -m json.tool .github/config/full-linux-coverage.json >/dev/null
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/config/full-linux-coverage.json \
            .github/scripts/kernel_coverage.py \
            .github/scripts/test_full_linux_coverage.py \
            docs/FULL-LINUX-COVERAGE.md
          if git diff --cached --quiet; then
            echo "Production repair is already applied."
            exit 0
          fi
          git commit -m "ci: fix Rust coverage Kconfig and bindgen toolchain"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
