name: Apply Rust bindgen installation conflict fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-rust-bindgen-conflict-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-rust-bindgen-install-conflict
          fetch-depth: 1

      - name: Replace conflicting distro bindgen package with pinned Cargo install
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('.github/config/full-linux-coverage.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['rust_toolchain'] = {
              'rust_version': '1.96.1',
              'bindgen_crate': 'bindgen-cli',
              'bindgen_version': '0.71.1',
          }
          for task in config['auxiliary_tasks']:
              packages = task.get('extra_packages', [])
              task['extra_packages'] = [package for package in packages if package != 'bindgen-0.71']
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          matrix_path = Path('.github/scripts/full_linux_matrix.py')
          matrix = matrix_path.read_text(encoding='utf-8')
          old_matrix = '                "extra_packages": ["bindgen-0.71", "rustup"],\n'
          new_matrix = '                "extra_packages": ["rustup"],\n'
          if old_matrix not in matrix:
              raise SystemExit('Rust matrix package block was not found exactly once')
          matrix_path.write_text(matrix.replace(old_matrix, new_matrix, 1), encoding='utf-8')

          kernel_path = Path('.github/scripts/kernel_coverage.py')
          kernel = kernel_path.read_text(encoding='utf-8')
          old_kernel = '''        rustc = find_executable(rustup_home / "toolchains", "rustc")\n        rustdoc = find_executable(rustup_home / "toolchains", "rustdoc")\n        rustfmt = find_executable(rustup_home / "toolchains", "rustfmt")\n        clippy = find_executable(rustup_home / "toolchains", "clippy-driver")\n        bindgen_name = rust_cfg.get("bindgen_binary", "bindgen-0.71")\n        bindgen_text = shutil.which(bindgen_name)\n        if not bindgen_text:\n            raise FileNotFoundError(f"{bindgen_name} was not found; install the pinned bindgen package")\n        bindgen = Path(bindgen_text)\n        rust_sources = sorted(rustup_home.rglob("lib/rustlib/src/rust/library"))\n'''
          new_kernel = '''        rustc = find_executable(rustup_home / "toolchains", "rustc")\n        rustdoc = find_executable(rustup_home / "toolchains", "rustdoc")\n        rustfmt = find_executable(rustup_home / "toolchains", "rustfmt")\n        clippy = find_executable(rustup_home / "toolchains", "clippy-driver")\n        cargo = find_executable(rustup_home / "toolchains", "cargo")\n        bindgen_crate = rust_cfg.get("bindgen_crate", "bindgen-cli")\n        bindgen_version = rust_cfg["bindgen_version"]\n        bindgen_root = tool_root / "bindgen"\n        cargo_env = rust_env.copy()\n        cargo_env.update(\n            {\n                "RUSTUP_TOOLCHAIN": rust_version,\n                "CARGO_NET_RETRY": "5",\n                "CARGO_HTTP_TIMEOUT": "120",\n            }\n        )\n        subprocess.run(\n            [\n                str(cargo),\n                "install",\n                bindgen_crate,\n                "--version",\n                f"={bindgen_version}",\n                "--locked",\n                "--root",\n                str(bindgen_root),\n            ],\n            env=cargo_env,\n            check=True,\n        )\n        bindgen = bindgen_root / "bin/bindgen"\n        if not bindgen.is_file():\n            raise FileNotFoundError(f"Pinned bindgen executable was not installed: {bindgen}")\n        rust_sources = sorted(rustup_home.rglob("lib/rustlib/src/rust/library"))\n'''
          if kernel.count(old_kernel) != 1:
              raise SystemExit('Rust bindgen setup block was not found exactly once')
          kernel = kernel.replace(old_kernel, new_kernel)
          old_metadata = '''                "rustc": str(rustc),\n                "rustc_version": subprocess.check_output([str(rustc), "--version"], text=True).strip(),\n                "bindgen": str(bindgen),\n                "bindgen_version": subprocess.check_output([str(bindgen), "--version"], text=True).strip(),\n'''
          new_metadata = '''                "rustc": str(rustc),\n                "rustc_version": subprocess.check_output([str(rustc), "--version"], text=True).strip(),\n                "cargo": str(cargo),\n                "bindgen_crate": bindgen_crate,\n                "bindgen": str(bindgen),\n                "bindgen_version": subprocess.check_output([str(bindgen), "--version"], text=True).strip(),\n'''
          if kernel.count(old_metadata) != 1:
              raise SystemExit('Rust metadata block was not found exactly once')
          kernel_path.write_text(kernel.replace(old_metadata, new_metadata), encoding='utf-8')

          tests_path = Path('.github/scripts/test_full_linux_coverage.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    assert config["rust_toolchain"]["bindgen_binary"] == "bindgen-0.71"\n',
              '    assert config["rust_toolchain"]["bindgen_crate"] == "bindgen-cli"\n    assert config["rust_toolchain"]["bindgen_version"] == "0.71.1"\n',
          )
          tests = tests.replace(
              '        assert {"bindgen-0.71", "rustup"}.issubset(row["extra_packages"])\n',
              '        assert "rustup" in row["extra_packages"]\n        assert "bindgen-0.71" not in row["extra_packages"]\n',
          )
          marker = '    assert \'"--kunitconfig"\' in auxiliary_source\n'
          addition = '''    assert '"--kunitconfig"' in auxiliary_source\n    kernel_source = (ROOT / ".github/scripts/kernel_coverage.py").read_text(encoding="utf-8")\n    assert '"install",\\n                bindgen_crate' in kernel_source\n    assert 'f"={bindgen_version}"' in kernel_source\n'''
          if marker not in tests:
              raise SystemExit('Test insertion marker was not found')
          tests_path.write_text(tests.replace(marker, addition, 1), encoding='utf-8')

          docs_path = Path('docs/FULL-LINUX-COVERAGE.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              "the pinned `bindgen-0.71` package",
              "a pinned `bindgen-cli` 0.71.1 installation built by Cargo",
          )
          docs_path.write_text(docs, encoding='utf-8')
          PY
          git diff --check

      - name: Commit non-workflow production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/config/full-linux-coverage.json \
            .github/scripts/full_linux_matrix.py \
            .github/scripts/kernel_coverage.py \
            .github/scripts/test_full_linux_coverage.py \
            docs/FULL-LINUX-COVERAGE.md
          git commit -m "ci: install pinned bindgen with Cargo"
          git push origin HEAD:ci/fix-rust-bindgen-install-conflict
