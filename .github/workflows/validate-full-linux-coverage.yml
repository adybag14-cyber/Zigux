name: Validate full Linux coverage infrastructure

on:
  pull_request:
    paths:
      - .github/config/full-linux-coverage.json
      - .github/scripts/aggregate_linux_coverage.py
      - .github/scripts/auxiliary_coverage.py
      - .github/scripts/full_linux_matrix.py
      - .github/scripts/kernel_coverage.py
      - .github/scripts/test_full_linux_coverage.py
      - .github/workflows/full-linux-row.yml
      - .github/workflows/full-linux-source-coverage.yml
      - .github/workflows/validate-full-linux-coverage.yml
      - docs/FULL-LINUX-COVERAGE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd

      - name: Compile Python and parse configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/*.py
          python3 -m json.tool .github/config/full-linux-coverage.json >/dev/null
          ruby -e 'require "yaml"; ARGV.each { |path| abort("invalid YAML: #{path}") unless YAML.parse_file(path) }' \
            .github/workflows/full-linux-row.yml \
            .github/workflows/full-linux-source-coverage.yml \
            .github/workflows/validate-full-linux-coverage.yml

      - name: Run offline matrix, mapping, archive-safety and aggregation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_full_linux_coverage.py

      - name: Verify pinned toolchains, packages, and source configuration targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: rolling-linux-sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          config = json.loads(Path('.github/config/full-linux-coverage.json').read_text())

          def get(url: str, *, github: bool = False, accept: str | None = None) -> str:
              headers = {'User-Agent': 'Zigux-full-linux-coverage-validator/3'}
              if github:
                  headers.update({
                      'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                      'Accept': accept or 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read().decode('utf-8', errors='replace')

          checksum_cache = {}
          def require_archive(base_url: str, archive: str) -> None:
              text = checksum_cache.setdefault(base_url, get(base_url.rstrip('/') + '/sha256sums.asc'))
              pattern = rf'^[0-9a-fA-F]{{64}}\s+\*?{re.escape(archive)}$'
              if not re.search(pattern, text, re.MULTILINE):
                  raise SystemExit(f'{archive} is absent from {base_url}/sha256sums.asc')

          gcc = config['gcc_toolchain']
          triples = {item.get('gcc_triple', '') for item in config['architectures'] if item.get('gcc_triple')}
          for triple in sorted(triples):
              require_archive(
                  gcc['base_url'],
                  f'x86_64-gcc-{gcc["version"]}-nolibc-{triple}.tar.xz',
              )
          require_archive(config['llvm_toolchain']['base_url'], config['llvm_toolchain']['archive'])

          rust_cfg = config['rust_toolchain']
          rust_version = rust_cfg['rust_version']
          rust_checksum = get(f'https://static.rust-lang.org/dist/channel-rust-{rust_version}.toml.sha256').strip()
          if not re.match(r'^[0-9a-f]{64}(?:\s|$)', rust_checksum):
              raise SystemExit(f'Rust {rust_version} channel checksum is invalid or unavailable')

          bindgen_crate = rust_cfg['bindgen_crate']
          bindgen_version = rust_cfg['bindgen_version']
          crate_url = (
              'https://crates.io/api/v1/crates/'
              f'{urllib.parse.quote(bindgen_crate, safe="")}/'
              f'{urllib.parse.quote(bindgen_version, safe="")}'
          )
          crate_data = json.loads(get(crate_url))
          if crate_data.get('version', {}).get('num') != bindgen_version:
              raise SystemExit(f'{bindgen_crate} {bindgen_version} is unavailable from crates.io')

          repository = os.environ['REPOSITORY']
          source_ref = urllib.parse.quote(os.environ['SOURCE_REF'], safe='')
          for arch in config['architectures']:
              arch_path = f'arch/{arch["kbuild_arch"]}'
              url = f'https://api.github.com/repos/{repository}/contents/{arch_path}?ref={source_ref}'
              get(url, github=True)
              target = arch['config_target']
              if target != 'defconfig':
                  path = f'{arch_path}/configs/{target}'
                  url = f'https://api.github.com/repos/{repository}/contents/{path}?ref={source_ref}'
                  get(url, github=True)

          min_versions = get(
              f'https://api.github.com/repos/{repository}/contents/scripts/min-tool-version.sh?ref={source_ref}',
              github=True,
              accept='application/vnd.github.raw+json',
          )
          s390_match = re.search(r'if \[ "\$SRCARCH" = "s390" \]; then\s+echo ([0-9.]+)', min_versions)
          bindgen_match = re.search(r'bindgen\)\s+echo ([0-9.]+)', min_versions)
          if not s390_match or not bindgen_match:
              raise SystemExit('Could not parse rolling Rust/bindgen minimum versions')

          def version_tuple(value: str) -> tuple[int, ...]:
              return tuple(int(part) for part in value.split('.'))

          if version_tuple(rust_version) < version_tuple(s390_match.group(1)):
              raise SystemExit(f'Rust {rust_version} is below rolling s390 minimum {s390_match.group(1)}')
          if version_tuple(bindgen_version) < version_tuple(bindgen_match.group(1)):
              raise SystemExit(f'bindgen {bindgen_version} is below rolling minimum {bindgen_match.group(1)}')
          print(
              f'verified {len(triples)} GCC archives, LLVM, Rust {rust_version}, '
              f'{bindgen_crate} {bindgen_version}, 21 architecture directories and custom defconfigs'
          )
          PY

          required_packages=(
            rustup
            libbabeltrace2-dev
            libcapstone-dev
            libpfm4-dev
            libtraceevent-dev
            libtracefs-dev
            libasound2-dev
            llvm
          )
          for package in "${required_packages[@]}"; do
            apt-cache show "${package}" >/dev/null || {
              echo "::error::Required Ubuntu package is unavailable: ${package}"
              exit 1
            }
          done
          sudo apt-get --simulate install rustup >/dev/null

      - name: Exercise pinned Rust and bindgen installation
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(jq -r '.rust_toolchain.rust_version' .github/config/full-linux-coverage.json)"
          bindgen_crate="$(jq -r '.rust_toolchain.bindgen_crate' .github/config/full-linux-coverage.json)"
          bindgen_version="$(jq -r '.rust_toolchain.bindgen_version' .github/config/full-linux-coverage.json)"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rustup
          export RUSTUP_HOME="${RUNNER_TEMP}/rustup-home"
          export CARGO_HOME="${RUNNER_TEMP}/cargo-home"
          export RUSTUP_TOOLCHAIN="${rust_version}"
          rustup toolchain install "${rust_version}" \
            --profile minimal \
            --component rust-src \
            --component rustfmt \
            --component clippy
          cargo install "${bindgen_crate}" \
            --version "=${bindgen_version}" \
            --locked \
            --root "${RUNNER_TEMP}/bindgen"
          rustc --version
          "${RUNNER_TEMP}/bindgen/bin/bindgen" --version | grep -F "${bindgen_version}"

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git ls-files | grep -Eq '(^|/)__pycache__/|\.py[co]$'; then
            echo '::error::Python bytecode files or directories must not be committed.'
            exit 1
          fi
