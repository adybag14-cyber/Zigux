name: Validate Rust coverage repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/config/full-linux-coverage.json
      - .github/scripts/kernel_coverage.py
      - .github/scripts/test_full_linux_coverage.py
      - .github/workflows/full-linux-row.yml
      - .github/workflows/validate-rust-coverage-repair.yml

permissions:
  contents: read

concurrency:
  group: validate-rust-coverage-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve source and generate Rust matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      rust_matrix: ${{ steps.matrix.outputs.rust_matrix }}
      rust_count: ${{ steps.matrix.outputs.rust_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact rolling source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/rolling-linux-sync" | jq -r '.sha // empty')"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Generate all supported Rust rows
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/full_linux_matrix.py \
            --config .github/config/full-linux-coverage.json \
            --scope rust \
            --rand-seeds 0xC0FFEE,0x5EED \
            --plan-output rust-plan.json
          test "$(jq -r '.counts.rust' rust-plan.json)" = 7

  rust:
    name: Live Rust architecture coverage
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.rust_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  require-all-rust-rows:
    name: Require all seven Rust rows
    if: always()
    needs: [plan, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${PLAN_RESULT}" = success
          test "${RUST_RESULT}" = success
