name: Full Linux source coverage campaign
run-name: Full Linux source coverage — ${{ github.event.inputs.scope || 'full' }} — ${{ github.run_number }}

on:
  schedule:
    # One full campaign per month. The existing ten-row dual-profile build remains weekly.
    - cron: "41 2 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Campaign section to execute.
        required: true
        type: choice
        default: full
        options:
          - full
          - smoke
          - architecture
          - llvm
          - rust
          - hardening
          - dtbs
          - auxiliary
      source_ref:
        description: Branch, tag, or commit to resolve once for every campaign row.
        required: true
        type: string
        default: rolling-linux-sync
      rand_seeds:
        description: Comma-separated deterministic KCONFIG_SEED values.
        required: true
        type: string
        default: 0xC0FFEE,0x5EED

permissions:
  contents: read
  actions: read

concurrency:
  group: zigux-full-linux-source-coverage
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve source and generate campaign matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      architecture_matrix: ${{ steps.matrix.outputs.architecture_matrix }}
      architecture_count: ${{ steps.matrix.outputs.architecture_count }}
      llvm_matrix: ${{ steps.matrix.outputs.llvm_matrix }}
      llvm_count: ${{ steps.matrix.outputs.llvm_count }}
      rust_matrix: ${{ steps.matrix.outputs.rust_matrix }}
      rust_count: ${{ steps.matrix.outputs.rust_count }}
      hardening_matrix: ${{ steps.matrix.outputs.hardening_matrix }}
      hardening_count: ${{ steps.matrix.outputs.hardening_count }}
      dtbs_matrix: ${{ steps.matrix.outputs.dtbs_matrix }}
      dtbs_count: ${{ steps.matrix.outputs.dtbs_count }}
      auxiliary_matrix: ${{ steps.matrix.outputs.auxiliary_matrix }}
      auxiliary_count: ${{ steps.matrix.outputs.auxiliary_count }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact rolling source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'rolling-linux-sync' }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SOURCE_REF"], safe=""))')"
          commit_json="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}")"
          source_sha="$(jq -r '.sha // empty' <<< "${commit_json}")"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve ${SOURCE_REF} to an exact commit."
            exit 1
          }
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${SOURCE_REF} to ${source_sha}."

      - name: Generate bounded matrices
        id: matrix
        env:
          SCOPE: ${{ github.event.inputs.scope || 'full' }}
          RAND_SEEDS: ${{ github.event.inputs.rand_seeds || '0xC0FFEE,0x5EED' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/full_linux_matrix.py \
            --config .github/config/full-linux-coverage.json \
            --scope "${SCOPE}" \
            --rand-seeds "${RAND_SEEDS}" \
            --plan-output campaign-plan.json
          cat campaign-plan.json

      - name: Upload immutable campaign plan
        uses: actions/upload-artifact@v7
        with:
          name: full-linux-campaign-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: campaign-plan.json
          retention-days: 30

  architecture-coverage:
    name: Architecture/Kconfig coverage
    needs: plan
    if: needs.plan.outputs.architecture_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.architecture_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  llvm-coverage:
    name: LLVM/Clang coverage
    needs: plan
    if: needs.plan.outputs.llvm_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.llvm_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  rust-coverage:
    name: Rust-enabled architecture coverage
    needs: plan
    if: needs.plan.outputs.rust_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.rust_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  hardening-coverage:
    name: GCC plugin and incompatible hardening coverage
    needs: plan
    if: needs.plan.outputs.hardening_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.hardening_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  dtbs-coverage:
    name: Device-tree coverage
    needs: plan
    if: needs.plan.outputs.dtbs_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.dtbs_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: kernel

  auxiliary-coverage:
    name: Tools, samples, tests and documentation
    needs: plan
    if: needs.plan.outputs.auxiliary_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.auxiliary_matrix) }}
    uses: ./.github/workflows/full-linux-row.yml
    with:
      row_json: ${{ toJSON(matrix) }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      runner_type: auxiliary

  aggregate:
    name: Aggregate source-to-object coverage report
    needs:
      - plan
      - architecture-coverage
      - llvm-coverage
      - rust-coverage
      - hardening-coverage
      - dtbs-coverage
      - auxiliary-coverage
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install report dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd

      - name: Download every compact row record
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-record-*
          path: campaign-records
          merge-multiple: true

      - name: Build source-to-object and uncompiled-source reports
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/aggregate_linux_coverage.py \
            --records-root campaign-records \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${{ needs.plan.outputs.source_sha }}" \
            --output full-linux-coverage-report
          cat full-linux-coverage-report/SUMMARY.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload consolidated coverage report
        uses: actions/upload-artifact@v7
        with:
          name: full-linux-source-coverage-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}
          path: full-linux-coverage-report/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
