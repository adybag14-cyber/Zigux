name: Apply selftests and perf coverage fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-selftests-perf-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fix-selftests-perf-coverage
          fetch-depth: 1

      - name: Complete selftests dependency diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('.github/config/full-linux-coverage.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          selftests = next(task for task in config['auxiliary_tasks'] if task['id'] == 'selftests')
          if 'libcap-ng-dev' not in selftests['extra_packages']:
              selftests['extra_packages'].append('libcap-ng-dev')
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          auxiliary_path = Path('.github/scripts/auxiliary_coverage.py')
          auxiliary = auxiliary_path.read_text(encoding='utf-8')
          old = '''                    f"O={out_root}",\n                    "FORCE_TARGETS=1",\n                ],\n'''
          new = '''                    f"O={out_root}",\n                ],\n'''
          if old in auxiliary:
              auxiliary = auxiliary.replace(old, new, 1)
          elif new not in auxiliary:
              raise SystemExit('selftests FORCE_TARGETS block is in an unexpected state')
          auxiliary_path.write_text(auxiliary, encoding='utf-8')

          tests_path = Path('.github/scripts/test_full_linux_coverage.py')
          tests = tests_path.read_text(encoding='utf-8')
          old_assert = '''    assert "libasound2-dev" in auxiliary_by_id["selftests"]["extra_packages"]\n'''
          new_assert = '''    assert {"libasound2-dev", "libcap-ng-dev"}.issubset(auxiliary_by_id["selftests"]["extra_packages"])\n'''
          if old_assert in tests:
              tests = tests.replace(old_assert, new_assert, 1)
          elif new_assert not in tests:
              raise SystemExit('selftests package assertion is in an unexpected state')
          marker = '''    assert 'f"O={out_root}"' in auxiliary_source\n'''
          addition = '''    assert 'f"O={out_root}"' in auxiliary_source\n    assert 'FORCE_TARGETS=1' not in auxiliary_source\n'''
          if marker in tests and addition not in tests:
              tests = tests.replace(marker, addition, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
          git diff --check

      - name: Commit non-workflow production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/config/full-linux-coverage.json \
            .github/scripts/auxiliary_coverage.py \
            .github/scripts/test_full_linux_coverage.py
          if git diff --cached --quiet; then
            echo 'Selftests follow-up is already present.'
            exit 0
          fi
          git commit -m "ci: continue all selftest collections"
          git push origin HEAD:ci/fix-selftests-perf-coverage
