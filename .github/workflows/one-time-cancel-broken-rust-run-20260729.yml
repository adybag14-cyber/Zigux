name: One-time cancel broken Rust coverage campaign

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-cancel-broken-rust-run-20260729.yml

permissions:
  contents: write

concurrency:
  group: zigux-full-linux-source-coverage
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$(jq -n \
            --arg cancelled_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg run_id "30486909113" \
            '{cancelled_at:$cancelled_at,workflow_sha:$workflow_sha,cancelled_run_id:$run_id,concurrency_group:"zigux-full-linux-source-coverage"}')"
          encoded="$(printf '%s\n' "${marker}" | base64 -w0)"
          body="$(jq -n --arg message "ci: record broken Rust campaign cancellation" --arg content "${encoded}" '{message:$message,content:$content}')"
          curl --fail --silent --show-error --location \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.github/broken-rust-campaign-cancelled.json" \
            --data "${body}" >/dev/null
          echo "Cancelled broken full campaign ${run_id}."
