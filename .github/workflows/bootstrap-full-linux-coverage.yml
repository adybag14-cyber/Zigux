name: Bootstrap full Linux coverage campaign

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/bootstrap-full-linux-coverage.yml

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/full-linux-source-coverage
          fetch-depth: 0

      - name: Install reviewed campaign payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/full-linux-payload/part*.b64 | base64 -d > /tmp/full-linux-coverage-payload.tar.gz
          tar -xzf /tmp/full-linux-coverage-payload.tar.gz -C .
          rm -rf .github/full-linux-payload
          rm -f .github/workflows/bootstrap-full-linux-coverage.yml
          rm -rf .github/scripts/__pycache__
          git diff --check

      - name: Commit campaign infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/config/full-linux-coverage.json \
            .github/scripts/aggregate_linux_coverage.py \
            .github/scripts/auxiliary_coverage.py \
            .github/scripts/full_linux_matrix.py \
            .github/scripts/kernel_coverage.py \
            .github/scripts/test_full_linux_coverage.py \
            .github/workflows/full-linux-row.yml \
            .github/workflows/full-linux-source-coverage.yml \
            .github/workflows/validate-full-linux-coverage.yml \
            docs/FULL-LINUX-COVERAGE.md
          git add -u .github/full-linux-payload .github/workflows/bootstrap-full-linux-coverage.yml
          git commit -m "ci: add full Linux source coverage campaign"
          git push origin HEAD:ci/full-linux-source-coverage
